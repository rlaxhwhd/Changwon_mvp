<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>드림캐치 · 진단 프로세스 다이어그램</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --primary:#2E5BFF; --navy:#1C2442; --text-sub:#637381; --border:#E8ECF0;
    --danger:#EF4444; --success:#16A34A; --warning:#F59E0B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:linear-gradient(180deg,#F7F9FF,#fff 360px);color:var(--navy);padding:40px 24px 64px;}
  .wrap{max-width:1160px;margin:0 auto;}
  .head{text-align:center;margin-bottom:28px;}
  .head .badge{display:inline-block;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:14px;letter-spacing:.02em;}
  .head h1{font-size:27px;font-weight:800;letter-spacing:-.02em;}
  .head p{color:var(--text-sub);font-size:14px;margin-top:8px;}
  .legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:18px 0 26px;font-size:12.5px;color:var(--text-sub);}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend i{width:24px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid;}
  .board{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 8px 32px rgba(46,91,255,.10),0 4px 12px rgba(0,0,0,.05);padding:20px;}
  svg{width:100%;height:auto;display:block;}
  .foot{text-align:center;color:#99A1A9;font-size:12.5px;margin-top:22px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="badge">국립창원대학교 · 드림캐치 DREAMCATCH</span>
    <h1>진로취업 진단 · 로드맵 프로세스 다이어그램</h1>
    <p>6단계 파이프라인 · 유형 분기 · 재진단 피드백 루프 — CARE+7/SMART 핵심 프로세스 + AI 확장</p>
  </div>

  <div class="legend">
    <span><i style="background:#EEF2FF;border-color:#2E5BFF;"></i>검사 실시 단계</span>
    <span><i style="background:#fff;border-color:#CBD2D9;border-style:dashed;"></i>검사 없음</span>
    <span><i style="background:#FDECEC;border-color:#EF4444;"></i>취약관리 분기</span>
    <span><i style="background:#E9F8EF;border-color:#16A34A;"></i>가속 분기</span>
  </div>

  <div class="board">
  <svg viewBox="0 0 1120 880" role="img" aria-label="진단 프로세스 다이어그램">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9AA8C7"/>
      </marker>
      <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
      </marker>
      <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3D67FF"/><stop offset="1" stop-color="#2E5BFF"/>
      </linearGradient>
      <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2A3358"/><stop offset="1" stop-color="#1C2442"/>
      </linearGradient>
      <style>
        .t{font-family:'Pretendard','Noto Sans KR',sans-serif;}
        .title{font-weight:800;font-size:15px;}
        .sub{font-size:11.5px;}
        .stg{font-weight:800;font-size:11px;letter-spacing:.04em;}
      </style>
    </defs>

    <!-- ============ CONNECTORS (drawn first, under boxes) ============ -->
    <!-- S1 -> fan to 3 branch boxes -->
    <path d="M520,104 L520,128 M520,128 C520,140 195,138 195,150" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M520,128 L520,150" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M520,128 C520,140 845,138 845,150" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- branches -> merge into S2 -->
    <path d="M195,206 C195,224 520,222 520,238" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M520,206 L520,238" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M845,206 C845,224 520,222 520,238" fill="none" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- vertical spine arrows -->
    <line x1="520" y1="314" x2="520" y2="344" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="410" x2="520" y2="440" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="506" x2="520" y2="536" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="602" x2="520" y2="632" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="698" x2="520" y2="728" stroke="#9AA8C7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- S3 self recalculation loop -->
    <path d="M360,366 C300,360 300,396 356,392" fill="none" stroke="#2E5BFF" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text class="t" x="338" y="352" text-anchor="end" font-size="10.5" fill="#2E5BFF" font-weight="700">↻ 이수·데이터</text>
    <text class="t" x="338" y="366" text-anchor="end" font-size="10.5" fill="#2E5BFF" font-weight="700">변경 시 재계산</text>

    <!-- Feedback loop: S6 right -> up -> S1 right -->
    <path d="M680,762 L1060,762 L1060,72 L684,72" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
    <text class="t" x="1074" y="420" font-size="12" fill="#F59E0B" font-weight="800" transform="rotate(90 1074 420)" text-anchor="middle">재진단 루프 (미취업자)</text>

    <!-- ============ BOXES ============ -->
    <!-- S1 -->
    <g>
      <rect x="360" y="40" width="320" height="64" rx="14" fill="url(#gBlue)"/>
      <text class="t stg" x="378" y="64" fill="#CDD9FF">1단계 · 유형진단</text>
      <text class="t title" x="378" y="84" fill="#fff">학생 6유형 도출</text>
      <text class="t sub" x="378" y="99" fill="#E3EAFF">유형분류 검사(39문항) + 자기이해 검사</text>
    </g>

    <!-- Branch boxes -->
    <g>
      <rect x="70" y="150" width="250" height="56" rx="12" fill="#FDECEC" stroke="#EF4444" stroke-width="1.5"/>
      <text class="t title" x="86" y="174" fill="#C2350F" font-size="13.5">취약관리형 → 집중관리</text>
      <text class="t sub" x="86" y="191" fill="#A14437">집중상담·소그룹 후 본류 합류 (학년 무관)</text>
    </g>
    <g>
      <rect x="395" y="150" width="250" height="56" rx="12" fill="#EEF2FF" stroke="#2E5BFF" stroke-width="1.5"/>
      <text class="t title" x="411" y="174" fill="#1C3FB8" font-size="13.5">표준 4유형 → 정규 진행</text>
      <text class="t sub" x="411" y="191" fill="#4A5AA0">미탐색·설정·성장·취업준비형</text>
    </g>
    <g>
      <rect x="720" y="150" width="250" height="56" rx="12" fill="#E9F8EF" stroke="#16A34A" stroke-width="1.5"/>
      <text class="t title" x="736" y="174" fill="#0E7A36" font-size="13.5">우수인재형 → 가속</text>
      <text class="t sub" x="736" y="191" fill="#3C7A55">3·4학년 위주 · 기업연계·멘토 조기진입</text>
    </g>

    <!-- S2 (검사 없음) -->
    <g>
      <rect x="360" y="250" width="320" height="64" rx="14" fill="#fff" stroke="#CBD2D9" stroke-width="1.8" stroke-dasharray="6 4"/>
      <text class="t stg" x="378" y="274" fill="#99A1A9">2단계 · 상담 / IAP 설정</text>
      <text class="t title" x="378" y="294" fill="#1C2442">IAP 유형 R1~R6 확정</text>
      <text class="t sub" x="378" y="309" fill="#EF4444">검사 없음 · 상담사 1·2차 + AI 분석</text>
    </g>

    <!-- S3 -->
    <g>
      <rect x="360" y="346" width="320" height="64" rx="14" fill="#fff" stroke="#2E5BFF" stroke-width="1.8"/>
      <text class="t stg" x="378" y="370" fill="#5A7FFF">3단계 · 경력개발 로드맵</text>
      <text class="t title" x="378" y="390" fill="#1C2442">단·중·장기 맞춤 로드맵</text>
      <text class="t sub" x="378" y="405" fill="#2E5BFF">CARES + 학년·학점·자격증·수강과목</text>
    </g>

    <!-- S4 -->
    <g>
      <rect x="360" y="442" width="320" height="64" rx="14" fill="#fff" stroke="#2E5BFF" stroke-width="1.8"/>
      <text class="t stg" x="378" y="466" fill="#5A7FFF">4단계 · 역량강화</text>
      <text class="t title" x="378" y="486" fill="#1C2442">직무군 매칭 · AI 활동추천</text>
      <text class="t sub" x="378" y="501" fill="#2E5BFF">KVCT + E-DISC + SPRINT Ⅰ</text>
    </g>

    <!-- S5-1 (검사 없음) -->
    <g>
      <rect x="360" y="538" width="320" height="64" rx="14" fill="#fff" stroke="#CBD2D9" stroke-width="1.8" stroke-dasharray="6 4"/>
      <text class="t stg" x="378" y="562" fill="#99A1A9">5-1단계 · 기업연계</text>
      <text class="t title" x="378" y="582" fill="#1C2442">기업연계 실전 경험</text>
      <text class="t sub" x="378" y="597" fill="#EF4444">검사 없음(M4 재활용) · 인턴·일경험</text>
    </g>

    <!-- S5-2 -->
    <g>
      <rect x="360" y="634" width="320" height="64" rx="14" fill="#fff" stroke="#2E5BFF" stroke-width="1.8"/>
      <text class="t stg" x="378" y="658" fill="#5A7FFF">5-2단계 · 취업지원</text>
      <text class="t title" x="378" y="678" fill="#1C2442">AI 자소서·면접·포트폴리오</text>
      <text class="t sub" x="378" y="693" fill="#2E5BFF">SPRINT Ⅱ + 매칭 프로토콜</text>
    </g>

    <!-- S6 -->
    <g>
      <rect x="360" y="730" width="320" height="64" rx="14" fill="url(#gNavy)"/>
      <text class="t stg" x="378" y="754" fill="#9AA8C7">6단계 · 사후관리</text>
      <text class="t title" x="378" y="774" fill="#fff">미취업자 재진단·재배치</text>
      <text class="t sub" x="378" y="789" fill="#C7CEE0">NEO 성격검사 / 재진단 · 집중관리 강도</text>
    </g>
  </svg>
  </div>

  <div class="foot">검사 자동 산출 → 상담사·AI 확정 · 검사는 단계별 분할 실시 · 재진단은 6단계에서만 발생</div>
</div>
</body>
</html>
