<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드림캐치 현행 DB ERD — 운영 중인 428개 테이블</title>
<style>
/* ══ 토큰 ═══════════════════════════════════════════════════════
   기존 docs/DB_ERD.html 의 서체·잉크·블루를 계승하되, 문서가 아니라
   캔버스 앱이므로 전체화면 셸로 바꾼다. */
:root{
  --paper:#ffffff;
  --surface:#f5f6f8;
  --panel:#fbfbfc;
  --ink:#1f2328;
  --ink-2:#4a5159;
  --meta:#767f8a;
  --line:#e3e6ea;
  --line-2:#eef0f3;
  --accent:#1c69d4;
  --accent-soft:#eaf1fc;
  --danger:#c0392b;
  --edge:#c3c9d2;
  --shadow:0 1px 2px rgba(16,22,30,.06), 0 4px 12px rgba(16,22,30,.05);
  --shadow-lift:0 2px 6px rgba(16,22,30,.1), 0 12px 28px rgba(16,22,30,.12);
  --tint:6%;      /* 그룹 레인 배경 농도 */
  --tint-box:0%;  /* 테이블 본문 농도 */

  --g0:#64748b; --g1:#7c3aed; --g2:#0f766e; --g3:#1d4ed8; --g4:#0891b2;
  --g5:#b45309; --g6:#15803d; --g7:#be123c; --g8:#a21caf;
  --g9:#4d7c0f; --g10:#db2777; --g11:#1e293b;

  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"D2Coding","Noto Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#161b22; --surface:#0e1218; --panel:#12171e;
    --ink:#e6eaf0; --ink-2:#b3bcc7; --meta:#8b95a2;
    --line:#272e38; --line-2:#1e242c;
    --accent:#5b9bf0; --accent-soft:#16233a;
    --danger:#e5726a;
    --edge:#3a434f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
    --tint:14%; --tint-box:9%;
    --g0:#94a3b8; --g1:#a78bfa; --g2:#2dd4bf; --g3:#60a5fa; --g4:#22d3ee;
    --g5:#fbbf24; --g6:#4ade80; --g7:#fb7185; --g8:#e879f9;
    --g9:#a3e635; --g10:#f472b6; --g11:#e2e8f0; --g11:#f472b6;
  }
}
:root[data-theme="dark"]{
  --paper:#161b22; --surface:#0e1218; --panel:#12171e;
  --ink:#e6eaf0; --ink-2:#b3bcc7; --meta:#8b95a2;
  --line:#272e38; --line-2:#1e242c;
  --accent:#5b9bf0; --accent-soft:#16233a;
  --danger:#e5726a;
  --edge:#3a434f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
  --tint:14%; --tint-box:9%;
  --g0:#94a3b8; --g1:#a78bfa; --g2:#2dd4bf; --g3:#60a5fa; --g4:#22d3ee;
  --g5:#fbbf24; --g6:#4ade80; --g7:#fb7185; --g8:#e879f9;
  --g9:#a3e635; --g10:#f472b6; --g11:#e2e8f0;
}
:root[data-theme="light"]{
  --paper:#ffffff; --surface:#f5f6f8; --panel:#fbfbfc;
  --ink:#1f2328; --ink-2:#4a5159; --meta:#767f8a;
  --line:#e3e6ea; --line-2:#eef0f3;
  --accent:#1c69d4; --accent-soft:#eaf1fc;
  --danger:#c0392b;
  --edge:#c3c9d2;
  --shadow:0 1px 2px rgba(16,22,30,.06), 0 4px 12px rgba(16,22,30,.05);
  --shadow-lift:0 2px 6px rgba(16,22,30,.1), 0 12px 28px rgba(16,22,30,.12);
  --tint:6%; --tint-box:0%;
  --g0:#64748b; --g1:#7c3aed; --g2:#0f766e; --g3:#1d4ed8; --g4:#0891b2;
  --g5:#b45309; --g6:#15803d; --g7:#be123c; --g8:#a21caf;
  --g9:#4d7c0f; --g10:#db2777; --g11:#1e293b;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

/* ══ 셸 ════════════════════════════════════════════════════════ */
#shell{display:grid; grid-template-rows:auto 1fr; height:100vh}
#body{display:grid; grid-template-columns:264px 1fr 340px; min-height:0}

/* ── 상단바 ── */
#top{
  display:flex; align-items:center; gap:14px; padding:0 16px; height:56px;
  background:var(--paper); border-bottom:1px solid var(--line); position:relative; z-index:20;
}
#top .brand{display:flex; flex-direction:column; gap:1px; margin-right:4px; min-width:0}
#top .brand b{font-size:13.5px; font-weight:650; letter-spacing:-.01em; white-space:nowrap}
#top .brand span{font-size:10.5px; color:var(--meta); letter-spacing:.03em; white-space:nowrap}
#top .counts{
  display:flex; gap:12px; padding-left:14px; border-left:1px solid var(--line);
  font-size:11.5px; color:var(--meta); font-variant-numeric:tabular-nums; white-space:nowrap;
}
#top .counts b{color:var(--ink-2); font-weight:640}
#top .sp{flex:1}
.grp{display:flex; align-items:center; gap:1px; background:var(--surface);
  border:1px solid var(--line); border-radius:7px; padding:2px}
.btn{
  border:1px solid transparent; background:transparent; border-radius:5px;
  padding:5px 9px; font-size:12px; cursor:pointer; color:var(--ink-2);
  white-space:nowrap; transition:background .12s, color .12s;
}
.btn:hover{background:var(--paper); color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--paper); color:var(--accent); box-shadow:var(--shadow)}
.btn.solid{background:var(--accent); color:#fff; border-color:transparent; font-weight:560}
.btn.solid:hover{background:var(--accent); filter:brightness(1.08); color:#fff}
.btn.ghost{border-color:var(--line); background:var(--paper)}
.btn.ghost:hover{border-color:var(--meta)}
.btn.mini{padding:3px 7px; font-size:11px}
.btn.dgr{color:var(--danger)}
#saved{font-size:11px; color:var(--meta); font-variant-numeric:tabular-nums; white-space:nowrap}
#zoomval{font-size:11.5px; color:var(--meta); min-width:42px; text-align:center;
  font-variant-numeric:tabular-nums}

/* ── 좌측 레일 ── */
#rail{
  background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
#search{
  margin:12px; padding:7px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--paper); font-size:12.5px; width:calc(100% - 24px);
}
#search::placeholder{color:var(--meta)}
#tree{overflow-y:auto; padding:0 8px 16px; flex:1; min-height:0}
.gsec{margin-bottom:3px}
.ghead{
  display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:6px;
  cursor:pointer; user-select:none;
}
.ghead:hover{background:var(--surface)}
.ghead .sw{width:9px; height:9px; border-radius:2.5px; flex:none; background:var(--gc)}
.ghead .nm{flex:1; font-size:12px; font-weight:600; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ghead .n{font-size:10.5px; color:var(--meta); font-variant-numeric:tabular-nums}
.ghead .eye{opacity:.45; font-size:11px; padding:1px 4px; border-radius:4px}
.ghead .eye:hover{opacity:1; background:var(--line-2)}
.gsec.hidden .nm,.gsec.hidden .n{opacity:.35; text-decoration:line-through}
.glist{padding:1px 0 6px 10px; margin-left:8px; border-left:1px solid var(--line-2)}
.tnode{
  display:flex; align-items:baseline; gap:7px; padding:3px 7px; border-radius:5px;
  cursor:pointer; font-size:11.5px;
}
.tnode:hover{background:var(--surface)}
.tnode.sel{background:var(--accent-soft); color:var(--accent)}
.tnode .en{font-family:var(--mono); font-size:11px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.tnode .ko{color:var(--meta); font-size:10.5px; margin-left:auto; white-space:nowrap}
.tnode.sel .ko{color:var(--accent)}
.railfoot{padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:6px}



/* ── 캔버스 ── */
#canvas{position:relative; overflow:hidden; background:var(--surface); min-width:0;
  cursor:grab; touch-action:none}
#canvas.panning{cursor:grabbing}
#canvas::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);
  background-size:24px 24px;
}
#world{position:absolute; top:0; left:0; transform-origin:0 0}
#edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
#lanes{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}

.node{
  position:absolute; width:272px; background:var(--paper);
  border:1px solid var(--nc); border-radius:8px; box-shadow:var(--shadow);
  overflow:hidden; transition:box-shadow .12s;
}
.node .hd{
  background:var(--nc); color:#fff; padding:5px 9px 6px; cursor:grab;
  display:flex; flex-direction:column; gap:0; line-height:1.3;
}
.node .hd:active{cursor:grabbing}
.node .hd .en{font-family:var(--mono); font-size:11.5px; font-weight:600;
  letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.node .hd .ko{font-size:10.5px; opacity:.82; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.node .bd{padding:3px 0 5px; background:color-mix(in srgb, var(--nc) var(--tint-box), var(--paper))}
.node .row{
  display:flex; align-items:center; gap:6px; height:19px; padding:0 9px;
  font-size:11px; white-space:nowrap;
}
.node .row .k{
  font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.02em;
  width:15px; flex:none; text-align:center; border-radius:2px; padding:1px 0; line-height:1.2;
}
.node .row .k.pk{background:var(--nc); color:#fff}
.node .row .k.fk{border:1px solid var(--nc); color:var(--nc)}
.node .row .k.no{visibility:hidden}
.node .row .en{font-family:var(--mono); font-size:10.5px; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis}
.node .row .ko{margin-left:auto; color:var(--meta); font-size:10px;
  overflow:hidden; text-overflow:ellipsis; padding-left:6px}
.node .more{padding:2px 9px 1px; font-size:10px; color:var(--meta); font-style:italic}
.node.sel{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift); z-index:6}
.node.dim{opacity:.28}
.node.linked{box-shadow:0 0 0 1.5px var(--nc), var(--shadow-lift); z-index:5}
.node.drag{box-shadow:var(--shadow-lift); z-index:20}
/* 컬럼 정의를 아직 못 받은 테이블 — 본문이 비어 헤더만 남는다 */
.node.nocol{border-style:dashed; opacity:.82}
.node.nocol .bd{min-height:6px}
.node.out{opacity:.12; filter:saturate(.15)}



.lane rect{fill:color-mix(in srgb, var(--gc) var(--tint), transparent); rx:14}
.lane .ol{fill:none; stroke:color-mix(in srgb, var(--gc) 42%, transparent);
  stroke-width:1; stroke-dasharray:3 4; rx:14}
/* 별도 DB 존 — 점선이 아니라 굵은 실선으로 물리적 경계를 표시 */
.lane.sep .ol{stroke-width:2.5; stroke-dasharray:none;
  stroke:color-mix(in srgb, var(--gc) 75%, transparent)}
.lane text{fill:var(--gc); font-family:var(--sans); font-size:13px; font-weight:650;
  letter-spacing:-.01em}
.lane .sub{fill:var(--meta); font-size:10.5px; font-weight:400}

/* ── 인스펙터 ── */
#insp{
  background:var(--panel); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
#insp .ihead{
  padding:12px 14px 11px; border-bottom:1px solid var(--line); background:var(--paper);
  display:flex; align-items:flex-start; gap:8px;
}
#insp .ihead .t{flex:1; min-width:0}
#insp .ihead .t .en{font-family:var(--mono); font-size:12.5px; font-weight:640}
#insp .ihead .t .ko{font-size:11px; color:var(--meta)}
#ibody{overflow-y:auto; flex:1; min-height:0; padding:0 0 28px}
.sec{padding:13px 14px; border-bottom:1px solid var(--line-2)}
.sec > h4{
  margin:0 0 8px; font-size:10.5px; font-weight:640; color:var(--meta);
  letter-spacing:.07em; text-transform:uppercase;
}
.fld{margin-bottom:8px}
.fld label{display:block; font-size:10.5px; color:var(--meta); margin-bottom:3px}
.fld input,.fld select,.fld textarea{
  width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); font-size:12px;
}
.fld input.mono{font-family:var(--mono); font-size:11.5px}
.fld textarea{resize:vertical; min-height:56px; line-height:1.55}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.cols{display:flex; flex-direction:column; gap:3px}
.crow{
  border:1px solid var(--line); border-radius:7px; background:var(--paper); overflow:hidden;
}
.crow > .sum{
  display:flex; align-items:center; gap:6px; padding:5px 7px; cursor:pointer; font-size:11.5px;
}
.crow > .sum:hover{background:var(--surface)}
.crow > .sum .en{font-family:var(--mono); font-size:11px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.crow > .sum .ko{color:var(--meta); font-size:10.5px; margin-left:auto;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:6px}
.crow > .sum .tag{font-size:8.5px; font-weight:700; padding:1px 4px; border-radius:3px;
  font-family:var(--mono); flex:none}
.tag.pk{background:var(--accent); color:#fff}
.tag.fk{border:1px solid var(--accent); color:var(--accent)}
.crow .det{padding:8px 8px 9px; border-top:1px solid var(--line-2); background:var(--panel)}
.crow.open > .sum{background:var(--surface)}
.crow .ord{display:flex; gap:3px; margin-left:2px}

.rel{
  display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:6px;
  font-size:11px; border:1px solid var(--line-2); background:var(--paper); margin-bottom:3px;
}
.rel .txt{flex:1; font-family:var(--mono); font-size:10.5px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; cursor:pointer}
.rel .dir{color:var(--meta); flex:none}
.note-p{font-size:11.5px; color:var(--ink-2); line-height:1.6; margin:0;
  white-space:pre-wrap; word-break:keep-all}
.empty{padding:40px 22px; text-align:center; color:var(--meta); font-size:12px; line-height:1.7}
.empty kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line);
  border-bottom-width:2px; border-radius:4px; padding:1px 5px; background:var(--paper)}

/* ── 범례 ── */
#legend{
  position:absolute; left:14px; bottom:14px; z-index:8; display:flex; flex-wrap:wrap;
  gap:3px 12px; max-width:520px; padding:9px 12px; background:color-mix(in srgb,var(--paper) 92%,transparent);
  border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow);
  backdrop-filter:blur(6px); font-size:10.5px;
}
#legend .k{display:inline-flex; align-items:center; gap:5px; color:var(--ink-2); cursor:pointer}
#legend .k .sw{width:9px; height:9px; border-radius:2.5px; background:var(--gc); flex:none}
#legend .k.off{opacity:.35; text-decoration:line-through}

#hint{
  position:absolute; right:14px; bottom:14px; z-index:8; font-size:10.5px; color:var(--meta);
  background:color-mix(in srgb,var(--paper) 92%,transparent); border:1px solid var(--line);
  border-radius:9px; padding:7px 11px; box-shadow:var(--shadow); backdrop-filter:blur(6px);
}
#hint kbd{font-family:var(--mono); font-size:10px; border:1px solid var(--line);
  border-radius:3px; padding:0 4px; background:var(--surface)}

/* ── 모달 ── */
#modal{position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:rgba(12,16,22,.5); backdrop-filter:blur(3px)}
#modal.on{display:grid}
#modal .box{
  width:min(720px,92vw); max-height:82vh; background:var(--paper); border-radius:12px;
  border:1px solid var(--line); box-shadow:var(--shadow-lift); display:flex; flex-direction:column;
}
#modal .box h3{margin:0; padding:14px 16px; font-size:13.5px; font-weight:640;
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
#modal .box h3 .sp{flex:1}
#modal textarea{
  flex:1; min-height:340px; margin:0; border:0; padding:14px 16px; resize:none;
  font-family:var(--mono); font-size:11.5px; line-height:1.65; background:var(--paper);
  white-space:pre; overflow:auto;
}
#modal .foot{padding:11px 16px; border-top:1px solid var(--line); display:flex;
  gap:8px; align-items:center}
#modal .foot .sp{flex:1}
#modal .foot .msg{font-size:11.5px; color:var(--meta)}
/* ── 역할 필터 ── */
#roles{padding:12px 12px 10px; border-bottom:1px solid var(--line)}
#roles .rhd{display:flex; align-items:baseline; gap:6px; margin-bottom:8px}
#roles .rhd b{font-size:10.5px; font-weight:640; color:var(--meta); letter-spacing:.07em; text-transform:uppercase}
#roles .rhd .src{margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--meta); opacity:.7}
.rchips{display:flex; flex-wrap:wrap; gap:4px}
.rchip{--rc:var(--meta); display:inline-flex; align-items:center; gap:4px; padding:3px 7px; border:1px solid var(--line); border-radius:20px; background:var(--paper); font-size:11px; color:var(--ink-2); cursor:pointer; line-height:1.5; transition:border-color .12s, background .12s}
.rchip:hover{border-color:var(--rc)}
.rchip .dot{width:7px; height:7px; border-radius:50%; background:var(--rc); flex:none}
.rchip b{font-variant-numeric:tabular-nums; font-size:10px; color:var(--meta); font-weight:600}
.rchip[aria-pressed="true"]{background:color-mix(in srgb, var(--rc) 12%, var(--paper)); border-color:var(--rc); color:var(--rc); font-weight:600}
.rchip[aria-pressed="true"] b{color:var(--rc); opacity:.75}
#rdesc{margin-top:8px; font-size:10.5px; color:var(--meta); line-height:1.6; word-break:keep-all}
#rdesc .src2{opacity:.7}
#rdesc .wr{display:inline-flex; gap:7px; margin-top:5px; font-variant-numeric:tabular-nums}
#rdesc .wr span{padding:1px 5px; border-radius:4px; background:var(--surface)}
#rwonly{margin-top:7px}
.node.out{opacity:.12; filter:saturate(.15)}
.node.hasrb .hd{padding-right:38px}
.node .rb{position:absolute; top:6px; right:7px; padding:1px 5px; border-radius:3px; font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.03em; line-height:1.45}
.node .rb.w{background:#fff; color:var(--nc)}
.node .rb.r{background:rgba(255,255,255,.18); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.node .rb .sc{opacity:.75; font-weight:600}
</style>
</head>
<body>
<div id="shell">

  <header id="top">
    <div class="brand">
      <b>현행 드림캐치 DB</b>
      <span>운영 중 · 실사 2026-08-05 · FK 3건 · PK 없는 테이블 122개</span>
    </div>
    <div class="counts">
      <span>테이블 <b id="c-t">0</b></span>
      <span>컬럼 <b id="c-c">0</b></span>
      <span>관계 <b id="c-r">0</b></span>
      <span>도메인 <b id="c-g">0</b></span>
    </div>
    <div class="sp"></div>

    <div class="grp" role="group" aria-label="보기">
      <button class="btn" id="b-cols" aria-pressed="true" title="PK·FK 컬럼만 표시">요약</button>
      <button class="btn" id="b-edges" aria-pressed="true" title="관계선 표시">관계선</button>

function load(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ saved = null; }
  if (saved && saved.tables && saved.tables.length){
    M = saved;
    if (saved.view) view = saved.view;
    if (saved.opts) opts = Object.assign(opts, saved.opts);
    M.tables.forEach(t=>{ if(!t.pos) t.pos = {x:0,y:0}; });
    stamp("불러옴");
  } else {
    M = JSON.parse(JSON.stringify(SEED));
    M.tables.forEach(t=>{ t.pos = null; });
    autoLayout();
  }
  /* 한글명은 모델에 둔다 — 편집분이 저장되도록 */
  M.tables.forEach(t=>{ if (t.ko === undefined) t.ko = KO0[t.name] || ""; });
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify(Object.assign({}, M, {view, opts})));
      stamp("저장됨");
    }catch(e){ stamp("저장 실패 — 용량 초과"); }
  }, 400);
}
function stamp(msg){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  $("#saved").textContent = `${msg} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ══ 자동 배치 ═════════════════════════════════════════════
   도메인 블록을 좌→우로 흘리고 폭을 넘기면 줄바꿈. 블록 안에서는
   테이블을 컬럼 수만큼 나눠 가장 짧은 열에 채운다(높이 균형). */
function boxH(t){
  const n = opts.cols ? Math.max(1, t.cols.filter(c=>c.pk||c.fk).length) : t.cols.length;
  return HDR + n*ROWH + BODYPAD;
}
function autoLayout(){
  const blocks = M.groups.map((g,gi)=>{
    const ts = M.tables.filter(t=>t.g===gi);
    /* 테이블이 많은 도메인일수록 열을 늘린다 — 안 그러면 그 블록 하나가
       전체 높이를 끌어올려 판이 세로로 길어진다 */
    const nc = ts.length<=3 ? 1 : ts.length<=8 ? 2 : Math.min(6, Math.ceil(ts.length/8));
    const colH = Array(nc).fill(0), colT = Array.from({length:nc},()=>[]);
    ts.slice().sort((a,b)=>boxH(b)-boxH(a)).forEach(t=>{
      let m = 0; for(let i=1;i<nc;i++) if(colH[i]<colH[m]) m=i;
      colT[m].push(t); colH[m] += boxH(t)+GAPY;
    });
    return { gi, colT,
      w: nc*(BOXW+GAPX)-GAPX + LANEPAD*2,
      h: Math.max(...colH,0)-GAPY + LANEPAD*2 + LANEHDR };
  }).filter(b=>b.colT.some(c=>c.length));

  /* 전체 판을 16:9 에 가깝게 펼친다 — 세로로만 길면 한눈에 안 들어온다.
     블록 넓이 합이 아니라 "면적"에서 역산해야 도메인 수가 늘어도 비율이 유지된다. */
  const area = blocks.reduce((a,b)=>a+b.w*b.h, 0);
  const MAXW = Math.max(2500, Math.round(Math.sqrt(area*16/9)));

  let x = 0, y = 0, rowH = 0;
  blocks.forEach(b=>{
    if (x>0 && x + b.w > MAXW){ x = 0; y += rowH + 46; rowH = 0; }
    b.x = x; b.y = y;
    let cx = x + LANEPAD;
    b.colT.forEach(col=>{
      let cy = y + LANEPAD + LANEHDR;
      col.forEach(t=>{ t.pos = {x:cx, y:cy}; cy += boxH(t)+GAPY; });
      cx += BOXW+GAPX;
    });
    x += b.w + 46; rowH = Math.max(rowH, b.h);
  });
  M.tables.filter(t=>!t.pos).forEach((t,i)=>{ t.pos = {x:i*40, y:-220}; });
}

/* 도메인 영역 = 소속 테이블 실제 위치의 바운딩 박스 */
function laneBoxes(){
  return M.groups.map((g,gi)=>{
    const ts = M.tables.filter(t=>t.g===gi && !hiddenG.has(t.g));
    if (!ts.length) return null;
    const x1 = Math.min(...ts.map(t=>t.pos.x)) - LANEPAD;
    const y1 = Math.min(...ts.map(t=>t.pos.y)) - LANEPAD - LANEHDR + 12;
    const x2 = Math.max(...ts.map(t=>t.pos.x+BOXW)) + LANEPAD;
    const y2 = Math.max(...ts.map(t=>t.pos.y+boxH(t))) + LANEPAD;
    return { gi, title:g.title, n:ts.length, x:x1, y:y1, w:x2-x1, h:y2-y1 };
  }).filter(Boolean);
}

/* ══ 렌더 ══════════════════════════════════════════════════ */
function visible(t){ return !hiddenG.has(t.g); }
function matches(t){
  if (!query) return true;
  const q = query.toLowerCase();
  if (t.name.toLowerCase().includes(q)) return true;
  if ((t.ko||"").toLowerCase().includes(q)) return true;
  return t.cols.some(c=>c.name.toLowerCase().includes(q) || (c.ko||"").includes(query));
}
function shownCols(t){ return opts.cols ? t.cols.filter(c=>c.pk||c.fk) : t.cols; }

function render(){
  renderCounts(); renderRoles(); renderLanes(); renderNodes(); renderEdges();
  renderTree(); renderLegend(); renderInsp(); applyView();
}

/* 컬럼 y 좌표 — 요약 모드에서 숨겨진 컬럼은 헤더 높이로 붙인다 */
function anchorY(t, colName){
  const cs = shownCols(t);
  const i = cs.findIndex(c=>c.name===colName);
  if (i < 0) return t.pos.y + HDR/2;
  return t.pos.y + HDR + 3 + i*ROWH + ROWH/2;
}

function renderEdges(){
  const svg = $("#edges");
  if (!opts.edges){ svg.innerHTML=""; return; }
  const paths = [];

  M.refs.forEach(r=>{
    const A = tbl(r.ft), B = tbl(r.tt);
    if (!A || !B || !visible(A) || !visible(B)) return;
    const on = sel && (r.ft===sel || r.tt===sel);
    const off = roleSel && !(inRole(A) && inRole(B));

    const ay = anchorY(A, r.fc), by = anchorY(B, r.tc);
    const aRight = (A.pos.x + BOXW/2) <= (B.pos.x + BOXW/2);
    const ax = aRight ? A.pos.x + BOXW : A.pos.x;
    const bx = aRight ? B.pos.x : B.pos.x + BOXW;
    const s  = aRight ? 1 : -1;
    const gap = Math.max(24, Math.min(70, Math.abs(bx-ax)/2));
    const c1 = ax + s*gap, c2 = bx - s*gap;
    const d = `M${ax},${ay} C${c1},${ay} ${c2},${by} ${bx},${by}`;
    const col = on ? gcol(A.g) : "var(--edge)";

    if (off && !on){ paths.push({on:false, html:
      `<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="1"
             opacity=".07" stroke-linecap="round"></path>`}); return; }
    paths.push({on, html:
      `<path d="${d}" fill="none" stroke="${col}" stroke-width="${on?1.8:1}"
             stroke-dasharray="${r.vw?"":"5 4"}"
             opacity="${on?1:(sel?.22:.55)}" stroke-linecap="round"></path>
       <circle cx="${ax}" cy="${ay}" r="${on?3.2:2.2}" fill="${col}"
               opacity="${on?1:(sel?.22:.55)}"></circle>
       <path d="M${bx},${by} l${-s*7},${-4.5} v9 z" fill="${col}"
             opacity="${on?1:(sel?.22:.55)}"></path>`});
  });
  /* 강조된 관계선을 나중에 그려 위로 올린다 */
  svg.innerHTML = paths.filter(p=>!p.on).map(p=>p.html).join("")
                + paths.filter(p=>p.on).map(p=>p.html).join("");
}

/* ══ 뷰 변환 ═══════════════════════════════════════════════ */
function applyView(){
  $("#world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $("#zoomval").textContent = Math.round(view.k*100)+"%";
}
function zoomAt(cx, cy, factor){
  const k2 = Math.min(2.2, Math.max(.18, view.k*factor));
  const r = $("#canvas").getBoundingClientRect();
  const px = cx-r.left, py = cy-r.top;
  view.x = px - (px-view.x)*(k2/view.k);
  view.y = py - (py-view.y)*(k2/view.k);
  view.k = k2; applyView(); save();
}
function fit(){
  const ts = M.tables.filter(visible);
  if (!ts.length) return;
  const x1 = Math.min(...ts.map(t=>t.pos.x)) - 80;
  const y1 = Math.min(...ts.map(t=>t.pos.y)) - 90;
  const x2 = Math.max(...ts.map(t=>t.pos.x+BOXW)) + 80;
  const y2 = Math.max(...ts.map(t=>t.pos.y+boxH(t))) + 80;
  const r = $("#canvas").getBoundingClientRect();
  /* 하한을 18%로 두면 큰 판이 화면 밖으로 잘렸다 — "맞춤"은 정말 다 보여야 한다 */
  view.k = Math.min(2.2, Math.max(.06, Math.min(r.width/(x2-x1), r.height/(y2-y1))));
  view.x = (r.width  - (x2-x1)*view.k)/2 - x1*view.k;
  view.y = (r.height - (y2-y1)*view.k)/2 - y1*view.k;
  applyView(); save();
}

/* ══ 편집 동작 ═════════════════════════════════════════════ */
function uniqueName(base){
  let n = base, i = 2;
  while (tbl(n)) n = base+"_"+(i++);
  return n;
}
function addTable(){
  const g = sel ? tbl(sel).g : 0;
  const name = uniqueName("dc_new_table");
  const r = $("#canvas").getBoundingClientRect();
  M.tables.push({
    name, g, ko:"", note:"", pos:{
      x: Math.round((r.width/2 - view.x)/view.k - BOXW/2),
      y: Math.round((r.height/2 - view.y)/view.k - 60) },
    cols:[{name:"id", ko:"ID", type:"varchar", pk:true, note:""}],
  });
  sel = name; openCol = -1;
  render(); save();
}
function delTable(name){
  const t = tbl(name); if (!t) return;
  const n = M.refs.filter(r=>r.ft===name||r.tt===name).length;
  if (!confirm(`${name}${n?` 및 연결된 관계 ${n}개`:""}를 삭제합니다.`)) return;
  M.tables = M.tables.filter(x=>x.name!==name);
  M.refs = M.refs.filter(r=>r.ft!==name && r.tt!==name);
  if (sel===name) sel = null;
  render(); save();
}
function renameTable(from, to){
  to = to.trim().replace(/\s+/g,"_");
  if (!to || to===from) return;
  if (tbl(to)){ alert(`이미 있는 이름입니다 — ${to}`); renderInsp(); return; }
  tbl(from).name = to;
  M.refs.forEach(r=>{ if(r.ft===from) r.ft=to; if(r.tt===from) r.tt=to; });
  sel = to; render(); save();
}
function markFk(){
  const fk = new Set(M.refs.map(r=>r.ft+"."+r.fc));
  M.tables.forEach(t=>t.cols.forEach(c=>{ c.fk = fk.has(t.name+"."+c.name); }));
}

/* ══ 내보내기 ══════════════════════════════════════════════ */
function toDBML(){
  const q = c => `"${c.name}${c.ko?" "+c.ko:""}"`;
  const pad = (s,n)=> s + " ".repeat(Math.max(1, n-[...s].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2E80?2:1),0)));
  const out = [];
  out.push("// 드림캐치(DREAMCATCH) 고도화 — 구축 대상 화면의 DB 설계");
  out.push("// docs/DB_ERD_EDITOR.html 에서 내보냄. dbdiagram.io 왼쪽 편집창에 붙여넣으세요.");
  out.push("");
  M.groups.forEach((g,gi)=>{
    const ts = M.tables.filter(t=>t.g===gi);
    if (!ts.length) return;
    out.push(`// ── ${g.title} ──`);
    ts.forEach(t=>{
      if (t.ko) out.push(`// ${t.ko}`);
      const n = GHEX.length;
      out.push(`Table ${t.name} [headercolor: ${GHEX[((t.g%n)+n)%n]}] {`);
      t.cols.forEach(c=>{
        const a = [];
        if (c.pk) a.push("pk");
        if (c.note) a.push(`note: '${c.note.replace(/'/g,"\\'")}'`);
        out.push(`  ${pad(q(c),34)}${pad(c.type,10)}${a.length?"["+a.join(", ")+"]":""}`.trimEnd());
      });
      if (t.note) out.push(`\n  Note: '${t.note.replace(/'/g,"\\'")}'`);
      out.push("}"); out.push("");
    });
  });
  out.push("");
  M.refs.forEach(r=>{
    const A = tbl(r.ft), B = tbl(r.tt);
    if (!A || !B) return;
    const ca = A.cols.find(c=>c.name===r.fc), cb = B.cols.find(c=>c.name===r.tc);
    if (!ca || !cb) return;
    out.push(`Ref: ${r.ft}.${q(ca)} ${r.kind||">"} ${r.tt}.${q(cb)}`);
  });
  out.push("");
  M.groups.forEach((g,gi)=>{
    const ts = M.tables.filter(t=>t.g===gi);
    if (!ts.length) return;
    out.push(`TableGroup "${g.title}" {`);
    ts.forEach(t=>out.push("  "+t.name));
    out.push("}"); out.push("");
  });
  return out.join("\n");
}
function openModal(fmt){
  $("#modal").classList.add("on");
  $$("#modal [data-fmt]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.fmt===fmt));
  $("#mtext").value = fmt==="dbml" ? toDBML()
    : JSON.stringify({groups:M.groups, tables:M.tables, refs:M.refs}, null, 2);
  $("#mtext").readOnly = fmt==="dbml";
  $("#mmsg").textContent = fmt==="dbml"
    ? "dbdiagram.io 왼쪽 편집창에 그대로 붙여넣습니다."
    : "이 JSON을 편집해 [적용]을 누르면 그대로 반영됩니다.";
  $("#m-apply").hidden = fmt!=="json";
  $("#modal").dataset.fmt = fmt;
}

/* ══ 이벤트 ════════════════════════════════════════════════ */
function bind(){
  /* -- 상단바 -- */
  $("#b-cols").onclick = e=>{
    opts.cols = !opts.cols; e.currentTarget.setAttribute("aria-pressed", opts.cols);
    render(); save();
  };
  $("#b-edges").onclick = e=>{
    opts.edges = !opts.edges; e.currentTarget.setAttribute("aria-pressed", opts.edges);
    renderEdges(); save();
  };
  $("#b-lanes").onclick = e=>{
    opts.lanes = !opts.lanes; e.currentTarget.setAttribute("aria-pressed", opts.lanes);
    renderLanes(); save();
  };
  $("#b-in").onclick  = ()=>{ const r=$("#canvas").getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1.2); };
  $("#b-out").onclick = ()=>{ const r=$("#canvas").getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.2); };
  $("#b-fit").onclick = fit;
  $("#b-add").onclick = addTable;
  $("#b-auto").onclick = ()=>{
    if (!confirm("모든 테이블을 도메인별로 다시 배치합니다. 옮겨 둔 위치는 사라집니다.")) return;
    autoLayout(); render(); fit(); save();
  };
  $("#b-theme").onclick = ()=>{
    const cur = document.documentElement.dataset.theme;
    document.documentElement.dataset.theme = cur==="dark" ? "light" : "dark";
    localStorage.setItem(KEY+"_theme", document.documentElement.dataset.theme);
  };
  $("#b-export").onclick = ()=>openModal("dbml");
  $("#b-import").onclick = ()=>openModal("json");
  $("#b-reset").onclick = ()=>{
    if (!confirm("편집 내용을 모두 버리고 원본 설계로 되돌립니다.")) return;
    localStorage.removeItem(KEY);
    M = JSON.parse(JSON.stringify(SEED));
    M.tables.forEach(t=>{ t.pos=null; t.ko = KO0[t.name]||""; });
    sel = null; hiddenG.clear(); query = ""; $("#search").value = "";
    autoLayout(); render(); fit(); save();
  };

  /* -- 검색 -- */
  $("#rchips").onclick = e=>{ const c=e.target.closest(".rchip"); if(!c) return;
    const id=c.dataset.r||null; roleSel=(roleSel===id)?null:id;
    if(!roleSel) roleWOnly=false; render(); };
  $("#rdesc").onclick = e=>{ if(!e.target.closest("#rwonly")) return; roleWOnly=!roleWOnly; render(); };
  $("#search").oninput = e=>{ query = e.target.value.trim(); renderNodes(); renderTree(); };

  /* -- 좌측 트리 -- */
  $("#tree").onclick = e=>{
    const eye = e.target.closest("[data-eye]");
    if (eye){
      const g = +eye.dataset.eye;
      hiddenG.has(g) ? hiddenG.delete(g) : hiddenG.add(g);
      render(); return;
    }
    const tn = e.target.closest(".tnode");
    if (tn){ selectTable(tn.dataset.t, true); return; }
    const gh = e.target.closest(".ghead");
    if (gh){
      const g = +gh.dataset.g;
      hiddenG.has(g) ? hiddenG.delete(g) : hiddenG.add(g);
      render();
    }
  };
  $("#legend").onclick = e=>{
    const k = e.target.closest("[data-g]"); if (!k) return;
    const g = +k.dataset.g;
    hiddenG.has(g) ? hiddenG.delete(g) : hiddenG.add(g);
    render();
  };

  /* -- 캔버스: 팬 · 줌 · 노드 드래그 -- */
  const cv = $("#canvas");
  cv.addEventListener("wheel", e=>{
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY<0 ? 1.12 : 1/1.12);
  }, {passive:false});

  let drag = null;
  cv.addEventListener("pointerdown", e=>{
    const hd = e.target.closest("[data-drag]");
    const node = e.target.closest(".node");
    if (hd && node){
      const t = tbl(node.dataset.t);
      drag = {kind:"node", t, node, sx:e.clientX, sy:e.clientY, ox:t.pos.x, oy:t.pos.y, moved:false};
      node.classList.add("drag");
    } else if (node){
      selectTable(node.dataset.t);
      return;
    } else {
      /* 빈 곳 — 끌면 팬, 이동 없이 놓으면 선택 해제(pointerup에서 판정) */
      drag = {kind:"pan", sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y, moved:false};
      cv.classList.add("panning");
    }
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", e=>{
    if (!drag) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
    if (drag.kind==="pan"){ view.x = drag.ox+dx; view.y = drag.oy+dy; applyView(); }
    else {
      drag.t.pos.x = Math.round(drag.ox + dx/view.k);
      drag.t.pos.y = Math.round(drag.oy + dy/view.k);
      drag.node.style.left = drag.t.pos.x+"px";
      drag.node.style.top  = drag.t.pos.y+"px";
      renderEdges(); if (opts.lanes) renderLanes();
    }
  });
  cv.addEventListener("pointerup", e=>{
    if (!drag) return;
    cv.classList.remove("panning");
    if (drag.kind==="node"){
      drag.node.classList.remove("drag");
      if (drag.moved){ sizeWorld(); save(); }
      else selectTable(drag.t.name);
    } else if (!drag.moved){
      selectTable(null);
    } else save();
    drag = null;
  });
  cv.addEventListener("pointercancel", ()=>{ drag=null; cv.classList.remove("panning"); });

  /* -- 인스펙터 -- */
  $("#insp").addEventListener("click", e=>{
    const t = tbl(sel); if (!t) return;
    const b = e.target.closest("button, [data-open], [data-goto]");
    if (!b) return;

    if (b.id==="i-del"){ delTable(sel); return; }
    if (b.id==="i-caddm"){
      t.cols.push({name:"new_col", ko:"", type:"varchar", pk:false, note:""});
      openCol = t.cols.length-1; render(); save(); return;
    }
    if (b.id==="r-add"){
      const fc = $("#r-fc").value, tt2 = $("#r-tt").value, tc = $("#r-tc").value;
      if (!fc || !tt2 || !tc) return;
      if (M.refs.some(r=>r.ft===sel&&r.fc===fc&&r.tt===tt2&&r.tc===tc)) return;
      M.refs.push({ft:sel, fc, tt:tt2, tc, kind:">"});
      markFk(); render(); save(); return;
    }
    if (b.dataset.rdel!==undefined){
      M.refs.splice(+b.dataset.rdel,1); markFk(); render(); save(); return;
    }
    if (b.dataset.cdel!==undefined){
      const ci = +b.dataset.cdel;
      const c = t.cols[ci];
      if (M.refs.some(r=>(r.ft===sel&&r.fc===c.name)||(r.tt===sel&&r.tc===c.name))){
        if (!confirm(`${c.name} 은 관계에 쓰이고 있습니다. 관계도 함께 지웁니다.`)) return;
        M.refs = M.refs.filter(r=>!((r.ft===sel&&r.fc===c.name)||(r.tt===sel&&r.tc===c.name)));
      }
      t.cols.splice(ci,1); openCol = -1; markFk(); render(); save(); return;
    }
    if (b.dataset.mv){
      const [ci,d] = b.dataset.mv.split(":").map(Number);
      const j = ci+d;
      if (j<0 || j>=t.cols.length) return;
      [t.cols[ci], t.cols[j]] = [t.cols[j], t.cols[ci]];
      if (openCol===ci) openCol = j; else if (openCol===j) openCol = ci;
      render(); save(); return;
    }
    if (b.dataset.open!==undefined){
      const ci = +b.dataset.open;
      openCol = openCol===ci ? -1 : ci;
      renderInsp(); return;
    }
    if (b.dataset.goto){ selectTable(b.dataset.goto, true); return; }
  });

  $("#insp").addEventListener("change", e=>{
    const t = tbl(sel); if (!t) return;
    const el = e.target;
    if (el.id==="i-name"){ renameTable(t.name, el.value); return; }
    if (el.id==="i-ko"){ t.ko = el.value.trim(); render(); save(); return; }
    if (el.id==="i-g"){ t.g = +el.value; render(); save(); return; }
    if (el.id==="i-note"){ t.note = el.value; renderNodes(); save(); return; }
    if (el.id==="r-tt"){ fillRefCols(); return; }
    if (el.dataset.cf){
      const [ci, f] = el.dataset.cf.split(":");
      const c = t.cols[+ci];
      if (f==="pk") c.pk = el.value==="1";
      else if (f==="name"){
        const old = c.name, nv = el.value.trim().replace(/\s+/g,"_");
        if (!nv) { renderInsp(); return; }
        c.name = nv;
        M.refs.forEach(r=>{
          if (r.ft===t.name && r.fc===old) r.fc = nv;
          if (r.tt===t.name && r.tc===old) r.tc = nv;
        });
      }
      else c[f] = el.value;
      markFk(); render(); save(); return;
    }
  });
  /* 텍스트는 입력 즉시 반영(포커스 유지) */
  $("#insp").addEventListener("input", e=>{
    const t = tbl(sel); if (!t) return;
    if (e.target.id==="i-note"){ t.note = e.target.value; save(); }
    if (e.target.dataset && e.target.dataset.cf){
      const [ci,f] = e.target.dataset.cf.split(":");
      if (f==="ko" || f==="note"){ t.cols[+ci][f] = e.target.value; renderNodes(); save(); }
    }
  });

  /* -- 모달 -- */
  $$("#modal [data-fmt]").forEach(b=>b.onclick = ()=>openModal(b.dataset.fmt));
  $("#m-close").onclick = ()=>$("#modal").classList.remove("on");
  $("#modal").onclick = e=>{ if (e.target.id==="modal") $("#modal").classList.remove("on"); };
  $("#m-copy").onclick = async ()=>{
    const ta = $("#mtext");
    try{ await navigator.clipboard.writeText(ta.value); $("#mmsg").textContent = "복사됨"; }
    catch(err){ ta.select(); document.execCommand("copy"); $("#mmsg").textContent = "복사됨"; }
  };
  $("#m-dl").onclick = ()=>{
    const fmt = $("#modal").dataset.fmt;
    const blob = new Blob([$("#mtext").value], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fmt==="dbml" ? "dreamcatch.dbml" : "dreamcatch-erd.json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  $("#m-apply").onclick = ()=>{
    let next;
    try{ next = JSON.parse($("#mtext").value); }
    catch(err){ $("#mmsg").textContent = "JSON 오류 — "+err.message; return; }
    if (!next || !Array.isArray(next.tables) || !Array.isArray(next.groups)){
      $("#mmsg").textContent = "groups · tables 배열이 필요합니다."; return;
    }
    M.groups = next.groups;
    M.tables = next.tables.map(t=>Object.assign({ko:"", note:"", cols:[], g:0}, t));
    M.refs = Array.isArray(next.refs) ? next.refs : [];
    M.tables.forEach(t=>{ if(!t.pos) t.pos=null; });
    if (M.tables.some(t=>!t.pos)) autoLayout();
    markFk(); sel = null; render(); fit(); save();
    $("#modal").classList.remove("on");
  };

  /* -- 키보드 -- */
  document.addEventListener("keydown", e=>{
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key==="Escape"){ $("#modal").classList.remove("on"); selectTable(null); }
    if ((e.key==="Delete"||e.key==="Backspace") && sel){ e.preventDefault(); delTable(sel); }
    if (e.key==="f" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); $("#search").focus(); }
    if (e.key==="0"){ fit(); }
  });

  window.addEventListener("resize", ()=>applyView());
}

function selectTable(name, center){
  sel = name; openCol = -1;
  renderNodes(); renderEdges(); renderTree(); renderInsp();
  if (name && center){
    const t = tbl(name); if (!t) return;
    const r = $("#canvas").getBoundingClientRect();
    view.x = r.width/2  - (t.pos.x+BOXW/2)*view.k;
    view.y = r.height/2 - (t.pos.y+boxH(t)/2)*view.k;
    applyView(); save();
  }
}

/* ══ 시작 ══════════════════════════════════════════════════ */
(function init(){
  const th = localStorage.getItem(KEY+"_theme");
  if (th) document.documentElement.dataset.theme = th;
  else document.documentElement.removeAttribute("data-theme");

  load(); markFk(); bind();
  $("#b-cols").setAttribute("aria-pressed", opts.cols);
  $("#b-edges").setAttribute("aria-pressed", opts.edges);
  $("#b-lanes").setAttribute("aria-pressed", opts.lanes);
  render();
  if (!localStorage.getItem(KEY)) fit();
})();
</script>
</body>
</html>
