# Local AI dependencies. Merge only with the root compose.yaml, never company Compose.
services:
  api:
    environment:
      DC_CHATBOT_ENABLED: "true"
      DC_CHATBOT_API_URL: ${DC_LOCAL_LLM_API_URL:-http://192.168.0.230:11435/v1/chat/completions}
      DC_CHATBOT_MODEL: ${DC_LOCAL_LLM_MODEL:-qwen3-32b-chat}
      DC_CHATBOT_SEARXNG_URL: http://searxng:8080
      DC_RAG_ENABLED: "true"
      DC_RAG_URL: http://rag:8090
      DC_RAG_KEY_FILE: /run/secrets/rag_key
      DC_ROADMAP_PROVIDER: local-rag
    secrets: [rag_key]
    depends_on:
      rag: {condition: service_healthy}
      searxng: {condition: service_healthy}
  qdrant-init:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    user: "0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown 10001:10001 /qdrant/storage"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes: [local_qdrant:/qdrant/storage]
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cpus: 1.0
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    entrypoint: [/bin/sh, -ec]
    command: ['export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_key)"; exec /qdrant/qdrant']
    volumes: [local_qdrant:/qdrant/storage]
    secrets: [qdrant_key]
    depends_on:
      qdrant-init: {condition: service_completed_successfully}
  rag:
    image: dreamcatch-rag:local
    build: ./deploy/rag
    restart: unless-stopped
    read_only: true
    cpus: 1.5
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      QDRANT_URL: http://qdrant:6333
    secrets: [rag_key, qdrant_key]
    depends_on: [qdrant]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 6
  searxng:
    image: searxng/searxng@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    restart: unless-stopped
    user: "977:977"
    read_only: true
    cpus: 1.0
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, "/var/cache/searxng:uid=977,gid=977,mode=0700"]
    environment:
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "4"
      FORCE_OWNERSHIP: "false"
    entrypoint: [/bin/sh, -ec]
    command: ['export SEARXNG_SECRET="$$(cat /run/secrets/searxng_secret)"; exec /usr/local/searxng/entrypoint.sh']
    volumes: [./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro]
    secrets: [searxng_secret]
    healthcheck:
      test: [CMD, /usr/local/searxng/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
secrets:
  rag_key: {file: ./deploy/secrets/rag_key_local}
  qdrant_key: {file: ./deploy/secrets/qdrant_key_local}
  searxng_secret: {file: ./deploy/secrets/searxng_secret_local}
volumes:
  local_qdrant:
