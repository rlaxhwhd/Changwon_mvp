<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1362" viewBox="0 0 750 1362" role="img" aria-labelledby="title desc">
  <title id="title">2022 NEXON KOREA 채용연계형 인턴십</title>
  <desc id="desc">넥슨코리아 채용연계형 인턴십 공고 포스터</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#030716"/>
      <stop offset="0.55" stop-color="#02091f"/>
      <stop offset="1" stop-color="#00123a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" x2="1">
      <stop offset="0" stop-color="#21e2ff"/>
      <stop offset="0.45" stop-color="#0e73ff"/>
      <stop offset="1" stop-color="#00318c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.38 0 0 0 0 1 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="750" height="1362" fill="url(#bg)"/>
  <g opacity="0.97">
    <text x="58" y="56" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="22" font-weight="800">NEXON</text>
    <path d="M39 38 58 27v23L39 61Z" fill="#f5f9ff"/>
    <path d="M39 38v23l19 10V50Z" fill="#7f90b6"/>
  </g>
  <g filter="url(#glow)">
    <path d="M527 70 632 16v230l-105-54Z" fill="url(#door)"/>
    <path d="M527 70h105l-105 122Z" fill="#58e4ff" opacity="0.36"/>
    <ellipse cx="604" cy="262" rx="148" ry="58" fill="#0057ff" opacity="0.42"/>
    <path d="M584 149c26 0 46 22 46 50s-20 50-46 50-47-22-47-50 21-50 47-50Z" fill="#000514"/>
    <circle cx="558" cy="136" r="20" fill="#000514"/>
    <circle cx="610" cy="136" r="20" fill="#000514"/>
    <path d="M554 238c-23 16-21 43 20 49 45 7 94 5 122 35" fill="none" stroke="#000514" stroke-width="13" stroke-linecap="round" opacity="0.65"/>
  </g>
  <text x="42" y="141" fill="#0879ff" font-family="Arial, sans-serif" font-size="39" font-weight="900">2022 NEXON KOREA</text>
  <text x="42" y="196" fill="#0879ff" font-family="Arial, sans-serif" font-size="44" font-weight="900">채용연계형 인턴십</text>
  <text x="42" y="235" fill="#dbe7ff" font-family="Arial, sans-serif" font-size="17">#기술본부   #글로벌보안본부   #사회공헌팀</text>
  <text x="42" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="800">2.24</text>
  <line x1="112" x2="135" y1="272" y2="272" stroke="#0879ff" stroke-width="3"/>
  <text x="160" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="800">3.10</text>
  <text x="214" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">4PM</text>
  <text x="76" y="411" fill="#0879ff" font-family="Arial, sans-serif" font-size="20" font-weight="900">모집 부문</text>
  <line x1="76" y1="430" x2="686" y2="430" stroke="#0879ff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#eef5ff">
    <text x="76" y="458">채용부서</text><text x="203" y="458">모집 포지션</text><text x="376" y="458">포지션 안내</text>
    <line x1="76" y1="474" x2="686" y2="474" stroke="#0879ff" stroke-width="2"/>
    <text x="76" y="512">기술본부</text><text x="203" y="512">기술PM</text><text x="376" y="512" fill="#0879ff">“넥슨 게임 출시를 위한 네비게이션”</text>
    <line x1="160" y1="519" x2="686" y2="519" stroke="#0879ff" stroke-dasharray="3 3" opacity="0.65"/>
    <text x="203" y="556">DBA/SE</text><text x="376" y="556" fill="#0879ff">“넥슨 인프라와 데이터의 모든 것”</text>
    <line x1="160" y1="563" x2="686" y2="563" stroke="#0879ff" stroke-dasharray="3 3" opacity="0.65"/>
    <text x="203" y="600">프론트엔드</text><text x="376" y="600" fill="#0879ff">“넥슨 게임 웹으로 유저와 소통하다”</text>
    <text x="203" y="623">디벨롭먼트 엔지니어</text>
    <line x1="76" y1="622" x2="686" y2="622" stroke="#0879ff" stroke-width="1.5"/>
    <text x="76" y="650">글로벌보안본부</text><text x="203" y="650">정보보안</text><text x="376" y="650" fill="#0879ff">“쉴드와 헬멧, 때로는 둘 다 무기가 될 수 있죠”</text>
    <line x1="76" y1="667" x2="686" y2="667" stroke="#0879ff" stroke-width="1.5"/>
    <text x="76" y="695">사회공헌팀</text><text x="203" y="695">사회공헌</text><text x="376" y="695" fill="#0879ff">“더 사랑받는 회사를 만드는 곳”</text>
    <line x1="76" y1="712" x2="686" y2="712" stroke="#0879ff" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#eef5ff">
    <text x="76" y="786" fill="#0879ff" font-size="20" font-weight="900">접수 기간</text>
    <text x="211" y="786" font-size="21">2022년 2월 24일(목) ~ 3월 10일(목) 오후 4시</text>
    <text x="76" y="842" fill="#0879ff" font-size="20" font-weight="900">인턴 기간</text>
    <text x="211" y="842" font-size="21">2022년 5월 2일(월) 부터 6개월간</text>
    <text x="76" y="899" fill="#0879ff" font-size="20" font-weight="900">자격 요건</text>
    <text x="211" y="899" font-size="19">기졸업자 및 22년 8월 졸업예정자</text>
    <text x="211" y="930" font-size="19">인턴기간 동안 Full-Time 근무가 가능한 분</text>
    <text x="211" y="961" font-size="19">인턴십 종료 후 정규직 입사가 가능한 분</text>
    <text x="211" y="992" font-size="19">병역필 또는 면제자로 해외여행에 결격 사유가 없는 분</text>
    <text x="76" y="1056" fill="#0879ff" font-size="20" font-weight="900">전형 안내</text>
    <text x="211" y="1056" font-size="19">서류심사 〉 과제전형 〉 면접전형 〉 최종합격</text>
    <text x="76" y="1116" fill="#0879ff" font-size="20" font-weight="900">기타 안내</text>
    <text x="211" y="1116" font-size="15">• 지원서 내 허위사실 기재 및 타인의 저작물 도용 시 전형에 불이익을 받을 수 있습니다.</text>
    <text x="211" y="1146" font-size="15">• 포지션간 중복 지원은 불가합니다.</text>
    <text x="211" y="1176" font-size="15">• 문의사항은 [넥슨채용사이트 〉 넥슨 〉 채용문의 〉 1:1문의] 로 문의해 주세요.</text>
  </g>
  <g transform="translate(285 1253)">
    <rect width="190" height="54" rx="8" fill="#126dff"/>
    <path d="M23 15v24l24-12Z" fill="#8bd0ff"/>
    <text x="70" y="35" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">상세정보</text>
  </g>
</svg>
