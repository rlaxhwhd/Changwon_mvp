# Private API service. The backend authenticates users; no host port is published.
use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo]
general:
  debug: false
  instance_name: Dreamcatch Search
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
search:
  safe_search: 1
  default_lang: ko-KR
  formats: [json]
server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  image_proxy: false
  # Set SEARXNG_SECRET from the container's /run/secrets/searxng_secret.
  secret_key: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 20
  pool_maxsize: 10
