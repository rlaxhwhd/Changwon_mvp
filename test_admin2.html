<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DREAMCATCH — 메인</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ============================================================
   Design Foundations — 가이드라인에 정의된 기반 값
   ============================================================ */
:root{
  --blue:#356dff;    --blue-soft:#eaf0ff;
  --violet:#7c5cfc;  --violet-soft:#f0edff;
  --mint:#20b486;    --mint-soft:#e5f8f2;
  --coral:#ff6b6b;   --coral-soft:#fff0f0;
  --amber:#f5a524;   --amber-soft:#fff6df;
  --sky:#17a9e6;     --sky-soft:#e7f7fd;
  --pink:#e85aad;    --pink-soft:#fdebf6;

  /* 중립 계열 — 가이드라인 미정의분, 화면 맥락에 맞춰 정의 */
  --ink:#15171c;
  --ink-2:#3d4351;
  --ink-3:#6f7686;
  --ink-4:#9aa1ae;
  --line:#e7eaf0;
  --line-2:#f0f2f6;
  --surface:#ffffff;
  --canvas:#f6f7fa;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  --shadow-1:0 1px 2px rgba(21,23,28,.04), 0 1px 3px rgba(21,23,28,.06);
  --shadow-2:0 4px 12px rgba(21,23,28,.06), 0 12px 28px rgba(21,23,28,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* Typography scale — 표에 정의된 값 그대로 */
.t-d1{font-size:56px;line-height:72px;letter-spacing:-.0319em}
.t-d3{font-size:36px;line-height:48px;letter-spacing:-.027em}
.t-t1{font-size:32px;line-height:44px;letter-spacing:-.0253em}
.t-t2{font-size:28px;line-height:38px;letter-spacing:-.0236em}
.t-t3{font-size:24px;line-height:32px;letter-spacing:-.023em}
.t-h1{font-size:22px;line-height:30px;letter-spacing:-.0194em}
.t-h2{font-size:20px;line-height:28px;letter-spacing:-.012em}
.t-hl1{font-size:18px;line-height:26px;letter-spacing:-.002em}
.t-hl2{font-size:17px;line-height:26px;letter-spacing:0}
.t-b1{font-size:16px;line-height:24px;letter-spacing:.0057em}
.t-b1r{font-size:16px;line-height:26px;letter-spacing:.0057em}
.t-b2{font-size:15px;line-height:22px;letter-spacing:.0096em}
.t-b2r{font-size:15px;line-height:24px;letter-spacing:.0096em}
.t-l1{font-size:14px;line-height:20px;letter-spacing:.0145em}
.t-l1r{font-size:14px;line-height:22px;letter-spacing:.0145em}
.t-l2{font-size:13px;line-height:18px;letter-spacing:.0194em}
.t-c1{font-size:12px;line-height:16px;letter-spacing:.0252em}
.t-c2{font-size:11px;line-height:14px;letter-spacing:.0311em}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;
  background:var(--canvas);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:16px;line-height:24px;letter-spacing:.0057em;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
svg{display:block}

/* ============================================================
   Grid — lg 1100 / xl 1440, 12컬럼, gutter 20px
   ============================================================ */
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}
@media (min-width:1600px){ .wrap{max-width:1440px} }

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
@media (max-width:992px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:768px){ .grid{grid-template-columns:repeat(2,1fr)} }

.col-4{grid-column:span 4}
.col-5{grid-column:span 5}
.col-7{grid-column:span 7}
.col-8{grid-column:span 8}
.col-12{grid-column:1/-1}
@media (max-width:1200px){
  .col-4,.col-5,.col-7,.col-8{grid-column:1/-1}
}

/* ============================================================
   Navigation
   ============================================================ */
.nav{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.nav__in{display:flex;align-items:center;gap:32px;height:64px}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand__mark{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  display:grid;place-items:center;color:#fff;
}
.brand__name{font-weight:800;letter-spacing:-.03em;font-size:19px}
.brand__sub{color:var(--ink-4);font-weight:500;margin-left:2px}

.menu{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.menu__item{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:var(--r-sm);
  color:var(--ink-2);font-weight:600;white-space:nowrap;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.menu__item:hover{background:var(--line-2);color:var(--ink)}
.menu__item[data-on="1"]{background:var(--blue-soft);color:var(--blue)}
.menu__item[data-lock="1"]{color:var(--ink-4);cursor:not-allowed}
.menu__item[data-lock="1"]:hover{background:transparent;color:var(--ink-4)}
.menu__step{
  width:18px;height:18px;border-radius:var(--r-full);flex-shrink:0;
  display:grid;place-items:center;background:var(--line);color:var(--ink-3);
  font-size:11px;line-height:1;font-weight:700;font-feature-settings:"tnum";
}
.menu__item[data-on="1"] .menu__step{background:var(--blue);color:#fff}
.menu__item[data-done="1"] .menu__step{background:var(--mint);color:#fff}

.nav__right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}

/* 데모 상태 전환 — 제품 UI가 아니라 시안 확인용 컨트롤이라 네비게이션 밖에 둔다 */
.demo{
  position:fixed;left:20px;bottom:20px;z-index:60;
  display:flex;align-items:center;gap:10px;
  padding:8px 10px 8px 14px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);
  opacity:.6;transition:opacity .2s var(--ease);
}
.demo:hover,.demo:focus-within{opacity:1}
.demo__l{
  color:var(--ink-4);font-weight:700;white-space:nowrap;
  font-size:11px;line-height:14px;letter-spacing:.0311em;
}
.seg{display:flex;padding:3px;background:var(--line-2);border-radius:var(--r-full)}
.seg button{
  padding:6px 12px;border-radius:var(--r-full);
  font-size:13px;line-height:18px;letter-spacing:.0194em;font-weight:600;color:var(--ink-3);
  white-space:nowrap;transition:all .18s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.iconbtn{
  position:relative;width:36px;height:36px;border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--ink-2);
}
.iconbtn:hover{background:var(--line-2)}
.iconbtn .dot{
  position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:var(--r-full);
  background:var(--coral);box-shadow:0 0 0 2px var(--surface);
}
.avatar{
  display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;
  border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface);
}
.avatar__img{
  width:28px;height:28px;border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--sky),var(--mint));
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;
}
.btn-login{
  padding:9px 18px;border-radius:var(--r-full);background:var(--blue);color:#fff;
  font-weight:700;font-size:14px;letter-spacing:.0145em;
  transition:filter .18s var(--ease),transform .18s var(--ease);
}
.btn-login:hover{filter:brightness(1.06);transform:translateY(-1px)}

/* ============================================================
   Shared blocks
   ============================================================ */
main{padding:32px 0 80px}
section{margin-bottom:24px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px;position:relative;height:100%;
}
.card--flush{padding:0;overflow:hidden}

.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.chead__t{font-size:20px;line-height:28px;letter-spacing:-.012em;font-weight:700;margin:0}
.chead__d{color:var(--ink-3);margin-top:2px;font-size:13px;line-height:18px;letter-spacing:.0194em}
.chead__r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:var(--r-full);
  font-size:12px;line-height:16px;letter-spacing:.0252em;font-weight:700;
  background:var(--line-2);color:var(--ink-3);
}
.pill--blue{background:var(--blue-soft);color:var(--blue)}
.pill--violet{background:var(--violet-soft);color:var(--violet)}
.pill--mint{background:var(--mint-soft);color:var(--mint)}
.pill--amber{background:var(--amber-soft);color:#b97708}
.pill--coral{background:var(--coral-soft);color:var(--coral)}
.pill--sky{background:var(--sky-soft);color:var(--sky)}
.pill--pink{background:var(--pink-soft);color:var(--pink)}

.tlink{
  display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);
  font-size:13px;line-height:18px;letter-spacing:.0194em;font-weight:600;
  padding:4px 8px;border-radius:var(--r-sm);
}
.tlink:hover{background:var(--line-2);color:var(--ink)}

/* 잠금 오버레이 — 순차 게이팅의 시각화 */
.gate{position:relative;overflow:hidden}
.gate__veil{
  position:absolute;inset:0;z-index:2;border-radius:var(--r-lg);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(3px) saturate(60%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:24px;text-align:center;
}
.gate__lock{
  width:44px;height:44px;border-radius:var(--r-full);display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-3);
  box-shadow:var(--shadow-1);margin-bottom:4px;
}
.gate__t{font-weight:700;font-size:15px;line-height:22px;letter-spacing:.0096em}
.gate__d{color:var(--ink-3);font-size:13px;line-height:18px;letter-spacing:.0194em;max-width:280px}
.gate__cta{
  margin-top:8px;padding:8px 16px;border-radius:var(--r-full);
  background:var(--ink);color:#fff;font-weight:700;
  font-size:13px;line-height:18px;letter-spacing:.0194em;
}
.gate__cta:hover{filter:brightness(1.25)}
.gate__cta[data-mute="1"]{background:var(--line);color:var(--ink-3);cursor:default}
.gate__cta[data-mute="1"]:hover{filter:none}
.gate.is-locked > *:not(.gate__veil){filter:grayscale(.9);opacity:.5;pointer-events:none;user-select:none}

/* ============================================================
   Hero — 진로취업 로드맵 진행현황
   ============================================================ */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:28px;overflow:hidden;position:relative;
}
.hero__top{display:flex;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.hero__eyebrow{
  color:var(--ink-3);font-weight:700;margin-bottom:8px;
  font-size:13px;line-height:18px;letter-spacing:.0194em;
  display:flex;align-items:center;gap:8px;
}
.hero__h{font-size:32px;line-height:44px;letter-spacing:-.0253em;font-weight:800;margin:0}
.hero__h em{font-style:normal;color:var(--blue)}
.hero__sub{color:var(--ink-3);margin-top:6px;font-size:16px;line-height:26px;letter-spacing:.0057em}

.hero__meter{margin-left:auto;text-align:right;flex-shrink:0}
.hero__meter-n{
  font-size:36px;line-height:48px;letter-spacing:-.027em;font-weight:800;
  font-feature-settings:"tnum";
}
.hero__meter-n span{font-size:20px;color:var(--ink-4);margin-left:2px}
.hero__meter-l{color:var(--ink-3);font-size:12px;line-height:16px;letter-spacing:.0252em;font-weight:600}

/* 5단계 레일 */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:992px){ .rail{grid-template-columns:repeat(2,1fr)} }
@media (max-width:768px){ .rail{grid-template-columns:1fr} }
.rail::before{
  content:"";position:absolute;left:0;right:0;top:26px;height:2px;background:var(--line);
}
@media (max-width:992px){ .rail::before{display:none} }
.rail__fill{
  position:absolute;left:0;top:26px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--mint));
  transition:width .7s var(--ease);
}
@media (max-width:992px){ .rail__fill{display:none} }

.stage{position:relative;z-index:1;text-align:left}
.stage__dot{
  width:54px;height:54px;border-radius:var(--r-full);
  background:var(--surface);border:2px solid var(--line);
  display:grid;place-items:center;color:var(--ink-4);
  margin-bottom:14px;transition:all .3s var(--ease);
}
.stage__no{
  position:absolute;top:-2px;left:40px;
  width:20px;height:20px;border-radius:var(--r-full);
  background:var(--line);color:var(--ink-3);
  display:grid;place-items:center;
  font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:800;
  border:2px solid var(--surface);font-feature-settings:"tnum";
}
.stage__name{font-size:17px;line-height:26px;font-weight:700;margin-bottom:4px}
.stage__state{
  font-size:13px;line-height:18px;letter-spacing:.0194em;font-weight:600;color:var(--ink-4);
}
.stage__bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:10px;overflow:hidden;max-width:120px}
.stage__bar i{display:block;height:100%;border-radius:2px;transition:width .7s var(--ease)}

.stage[data-s="done"] .stage__dot{border-color:var(--mint);background:var(--mint-soft);color:var(--mint)}
.stage[data-s="done"] .stage__no{background:var(--mint);color:#fff}
.stage[data-s="done"] .stage__state{color:var(--mint)}
.stage[data-s="current"] .stage__dot{
  border-color:var(--stage-c,var(--blue));background:var(--stage-s,var(--blue-soft));color:var(--stage-c,var(--blue));
  box-shadow:0 0 0 6px var(--stage-s,var(--blue-soft));
}
.stage[data-s="current"] .stage__no{background:var(--stage-c,var(--blue));color:#fff}
.stage[data-s="current"] .stage__state{color:var(--stage-c,var(--blue))}
.stage[data-s="current"] .stage__name{color:var(--ink)}
.stage[data-s="locked"] .stage__name{color:var(--ink-4)}
.stage[data-s="locked"] .stage__dot{border-style:dashed}

/* 다음 액션 배너 */
.next{
  margin-top:28px;padding:20px;border-radius:var(--r-lg);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:var(--next-s,var(--blue-soft));
  border:1px solid color-mix(in srgb,var(--next-c,var(--blue)) 18%,transparent);
}
.next__ico{
  width:44px;height:44px;border-radius:var(--r-md);flex-shrink:0;
  display:grid;place-items:center;background:var(--next-c,var(--blue));color:#fff;
}
.next__t{font-weight:700;font-size:17px;line-height:26px}
.next__d{color:var(--ink-2);margin-top:2px;font-size:14px;line-height:20px;letter-spacing:.0145em}
.next__btn{
  margin-left:auto;padding:12px 22px;border-radius:var(--r-full);
  background:var(--next-c,var(--blue));color:#fff;font-weight:700;
  font-size:15px;line-height:22px;letter-spacing:.0096em;flex-shrink:0;
  transition:filter .18s var(--ease),transform .18s var(--ease);
}
.next__btn:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* 튜토리얼 스트립 */
.tut{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 20px;border-radius:var(--r-lg);margin-bottom:20px;
  background:var(--violet-soft);border:1px solid color-mix(in srgb,var(--violet) 16%,transparent);
}
.tut__b{
  display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--violet);
  font-size:13px;line-height:18px;letter-spacing:.0194em;flex-shrink:0;
}
.tut__steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2)}
.tut__s{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  padding:5px 12px;border-radius:var(--r-full);
  font-size:13px;line-height:18px;letter-spacing:.0194em;font-weight:600;
}
.tut__s b{
  width:16px;height:16px;border-radius:var(--r-full);background:var(--violet);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:800;font-feature-settings:"tnum";
}
.tut__arrow{color:var(--ink-4)}
.tut__x{margin-left:auto;color:var(--ink-3);padding:6px;border-radius:var(--r-sm)}
.tut__x:hover{background:rgba(255,255,255,.7)}

/* ============================================================
   오늘 할 일 / 퀘스트
   ============================================================ */
.todo{display:flex;flex-direction:column;gap:2px}
.todo__i{
  display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--r-md);
  transition:background .16s var(--ease);
}
.todo__i:hover{background:var(--line-2)}
.todo__box{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--line);
  flex-shrink:0;margin-top:2px;display:grid;place-items:center;color:transparent;
  transition:all .18s var(--ease);
}
.todo__i[data-done="1"] .todo__box{background:var(--mint);border-color:var(--mint);color:#fff}
.todo__i[data-done="1"] .todo__t{color:var(--ink-4);text-decoration:line-through}
.todo__t{font-weight:600;font-size:15px;line-height:22px;letter-spacing:.0096em}
.todo__m{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--ink-4)}
.todo__due{
  font-size:12px;line-height:16px;letter-spacing:.0252em;font-weight:700;
}
.todo__due[data-urgent="1"]{color:var(--coral)}

.quest{display:flex;flex-direction:column;gap:12px}
.quest__i{
  display:flex;align-items:center;gap:14px;padding:14px;
  border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color .18s var(--ease),transform .18s var(--ease);
}
.quest__i:hover{border-color:var(--amber);transform:translateY(-1px)}
.quest__ico{
  width:40px;height:40px;border-radius:var(--r-md);flex-shrink:0;display:grid;place-items:center;
  background:var(--q-s,var(--amber-soft));color:var(--q-c,var(--amber));
}
.quest__body{flex:1;min-width:0}
.quest__t{font-weight:700;font-size:15px;line-height:22px;letter-spacing:.0096em}
.quest__bar{height:6px;border-radius:3px;background:var(--line-2);margin-top:8px;overflow:hidden}
.quest__bar i{display:block;height:100%;border-radius:3px;background:var(--q-c,var(--amber));transition:width .6s var(--ease)}
.quest__n{
  color:var(--ink-4);margin-top:6px;font-feature-settings:"tnum";
  font-size:12px;line-height:16px;letter-spacing:.0252em;font-weight:600;
}
.quest__pt{
  flex-shrink:0;text-align:right;color:var(--amber);font-weight:800;
  font-size:14px;line-height:20px;letter-spacing:.0145em;font-feature-settings:"tnum";
}

/* ============================================================
   출석체크
   ============================================================ */
.att__streak{
  display:flex;align-items:baseline;gap:8px;padding:16px;border-radius:var(--r-md);
  background:var(--coral-soft);margin-bottom:16px;
}
.att__n{
  font-size:28px;line-height:38px;letter-spacing:-.0236em;font-weight:800;color:var(--coral);
  font-feature-settings:"tnum";
}
.att__l{color:var(--ink-2);font-size:14px;line-height:20px;letter-spacing:.0145em;font-weight:600}
.att__row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.att__d{text-align:center}
.att__dow{
  color:var(--ink-4);margin-bottom:6px;font-weight:700;
  font-size:11px;line-height:14px;letter-spacing:.0311em;
}
.att__cell{
  aspect-ratio:1;border-radius:var(--r-md);border:1px solid var(--line);

/* ============================================================================
   2. GATE — 순차 게이팅 판정. 화면이 아니라 여기서만 상태를 계산한다.
   ============================================================================ */
let scenario = 'active';
const S = () => SCENARIOS[scenario];

function stageState(id){
  const s = S();
  if(!s.auth) return 'locked';
  const st = STAGES.find(x => x.id === id);
  const p  = s.progress[id] ?? 0;
  if(st.need && (s.progress[st.need] ?? 0) < 100) return 'locked';
  if(p >= 100) return 'done';
  return 'current';
}
/* needId 단계가 "완료"돼야 열린다. 잠겼다면 지금 실제로 해야 할 단계(=체인상 첫 미완료)를 blocker로 돌려준다 */
function gateOf(needId){
  const s = S();
  if(!s.auth) return { open:false, blocker:null, msg:'로그인 후 이용할 수 있습니다.', cta:'로그인' };
  const chain = [];
  let cur = STAGES.find(x => x.id === needId);
  while(cur){ chain.unshift(cur); cur = cur.need ? STAGES.find(x => x.id === cur.need) : null; }
  for(const c of chain){
    if((s.progress[c.id] ?? 0) < 100)
      return { open:false, blocker:c, msg:c.gateMsg, cta:`${c.name} 하러 가기` };
  }
  return { open:true };
}
const overallPct = () => {
  const s = S();
  if(!s.auth) return 0;
  return Math.round(STAGES.reduce((a, st) => a + (s.progress[st.id] ?? 0), 0) / STAGES.length);
};
const currentStage = () => STAGES.find(st => stageState(st.id) === 'current') || STAGES[STAGES.length - 1];

function veil(g, msgOverride){
  const cta = g.blocker
    ? `<button class="gate__cta" data-go="${g.blocker.id}">${g.cta}</button>`
    : `<button class="gate__cta" data-scn="pre">로그인</button>`;
  return `<div class="gate__veil">
    <span class="gate__lock">${ico('lock', 20, 2)}</span>
    <p class="gate__t">${g.blocker ? `${g.blocker.no}단계 ${g.blocker.name} 완료 후 열립니다` : '로그인이 필요합니다'}</p>
    <p class="gate__d">${msgOverride || g.msg}</p>${cta}</div>`;
}
const wrapGate = (needId, inner, msg) => {
  const g = gateOf(needId);
  return `<div class="card gate ${g.open ? '' : 'is-locked'}">${inner}${g.open ? '' : veil(g, msg)}</div>`;
};

/* ---------- 역량 그래프 (SVG 레이더) ---------- */
function renderCompetency(){
  const c = DATA.competency, n = c.axes.length;
  const cx = 150, cy = 142, R = 100;
  const pt = (i, v) => {
    const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n, r = (v / 100) * R;
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const poly = key => c.axes.map((a, i) => pt(i, a[key]).map(v => v.toFixed(1)).join(',')).join(' ');
  const rings = [25, 50, 75, 100].map(p =>
    `<polygon points="${c.axes.map((_, i) => pt(i, p).map(v => v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const spokes = c.axes.map((_, i) => {
    const [x, y] = pt(i, 100);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const labels = c.axes.map((a, i) => {
    const [x, y] = pt(i, 126);
    const anchor = Math.abs(x - cx) < 12 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}"
      font-size="12" letter-spacing=".025em" font-weight="700" fill="var(--ink-3)">${a.key}</text>
      <text x="${x.toFixed(1)}" y="${(y + 18).toFixed(1)}" text-anchor="${anchor}"
      font-size="11" font-weight="700" fill="var(--blue)">${a.me}</text>`;
  }).join('');
  const dots = c.axes.map((a, i) => {
    const [x, y] = pt(i, a.me);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--blue)" stroke="#fff" stroke-width="2"/>`;
  }).join('');

  const body = `
    <header class="chead">
      <div>
        <h2 class="chead__t">나의 역량 그래프</h2>
        <p class="chead__d">진단 결과 6개 영역 · 유형 평균 대비</p>
      </div>
      <div class="chead__r"><span class="pill pill--mint">▲ ${c.gained}점</span></div>
    </header>
    <div class="radar">
      <svg viewBox="0 0 300 290" width="100%" style="max-width:320px" role="img" aria-label="역량 레이더 차트">
        ${rings}${spokes}
        <polygon points="${poly('avg')}" fill="none" stroke="var(--ink-4)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <polygon points="${poly('me')}" fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>
      <div class="radar__side">
        <div class="radar__legend">
          <span class="radar__lg"><i class="radar__key" style="background:var(--blue)"></i>내 점수</span>
          <span class="radar__lg"><i class="radar__key" style="background:var(--ink-4)"></i>유형 평균</span>
        </div>
        <ul class="radar__list">${c.axes.map(a => {
          const gap = a.me - a.avg;
          return `<li class="radar__row">
            <span class="radar__k">${a.key}</span>
            <span class="radar__bar"><i style="width:${a.me}%"></i></span>
            <span class="radar__v">${a.me}</span>
            <span class="radar__gap" data-neg="${gap < 0 ? 1 : 0}">${gap >= 0 ? '+' : ''}${gap}</span>
          </li>`;
        }).join('')}</ul>
        <div class="radar__stats">
          <div class="radar__st"><b>${c.total}점</b><span>종합 역량점수</span></div>
          <div class="radar__st"><b>${c.rank}</b><span>동일 유형 내 위치</span></div>
        </div>
      </div>
    </div>`;
  return wrapGate('diagnosis', body, '역량 점수는 진단 결과에서 산출됩니다. 진단 없이는 그래프가 만들어지지 않습니다.');
}

      <div class="roll__dots" id="rollDots"></div>
    </div>`;
  const g = gateOf('roadmap');
  return `<div class="card card--flush gate ${g.open ? '' : 'is-locked'}">${body}${
    g.open ? '' : veil(g, '로드맵이 생성되어야 유형에 맞는 비교과 프로그램을 신청할 수 있습니다.')}</div>`;
}

function syncRoll(){
  const track = $('#rollTrack'); if(!track) return;
  const pages = rollPages();
  rollIdx = ((rollIdx % pages) + pages) % pages;
  const card = track.querySelector('.roll__card'); if(!card) return;
  const step = card.getBoundingClientRect().width + 20;
  track.style.transform = `translateX(${-rollIdx * step}px)`;
  const dots = $('#rollDots');
  if(dots) dots.innerHTML = Array.from({ length: pages },
    (_, i) => `<span class="roll__dot" data-on="${i === rollIdx ? 1 : 0}"></span>`).join('');
}
function startRoll(){
  clearInterval(rollTimer);
  if(!gateOf('roadmap').open) return;
  rollTimer = setInterval(() => { rollIdx++; syncRoll(); }, 4500);
}

/* ---------- 추천 채용공고 ---------- */
function renderJobs(){
  const body = `
    <header class="chead">
      <div>
        <h2 class="chead__t">추천 채용공고</h2>
        <p class="chead__d">역량 그래프와 진단 유형 기반 매칭</p>
      </div>
      <div class="chead__r"><a class="tlink" href="#">전체보기 ${ico('arrow', 13, 2.2)}</a></div>
    </header>
    <div class="jobs">${DATA.jobs.map(j => `
      <article class="job" style="--j-c:var(--${j.color});--j-s:var(--${j.color}-soft)">
        <div class="job__top">
          <span class="job__logo">${j.mark}</span>
          <div><p class="job__co">${j.co}</p><p class="job__loc">${j.loc}</p></div>
        </div>
        <h3 class="job__t">${j.title}</h3>
        <div class="job__tags">${j.tags.map(t => `<span class="job__tag">${t}</span>`).join('')}</div>
        <div class="job__match">
          <div class="job__mbar"><i style="width:${j.match}%"></i></div>
          <span class="job__mn">${j.match}%</span>
        </div>
        <div class="job__foot">
          <span class="job__dday">${j.dday}</span>
          <span class="job__more">상세보기</span>
        </div>
      </article>`).join('')}</div>`;
  return wrapGate('growth', body,
    `로드맵의 역량강화 활동을 모두 이수하면 매칭 결과가 공개됩니다. (현재 ${S().progress.growth ?? 0}%)`);
}

/* ---------- 비로그인 화면 ---------- */
function renderGuest(){
  return `
  <section class="guest">
    <div class="guest__in">
      <span class="guest__eye">${ico('spark', 14, 2.4)} 국립창원대학교 역량개발관리시스템</span>
      <h1 class="guest__h">진단부터 취업까지,<br/>순서대로 따라오세요</h1>
      <p class="guest__p">
        드림캐치는 5단계를 순서대로 진행합니다. 진단으로 내 유형을 찾고, 상담으로 방향을 정하고,
        그 결과로 만들어진 로드맵을 따라 역량을 쌓아 취업까지 이어집니다.
      </p>
      <div class="guest__cta">
        <button class="guest__b1" data-scn="pre">학생 로그인</button>
        <button class="guest__b2" data-scn="active">진행중 화면 미리보기</button>
      </div>
    </div>
  </section>

  <section>
    <header class="chead">
      <div>
        <h2 class="chead__t">5단계 진행 과정</h2>
        <p class="chead__d">앞 단계를 마쳐야 다음 단계가 열립니다</p>
      </div>
    </header>
    <div class="steps">${STAGES.map(st => `
      <article class="step" style="--s-c:var(--${st.color});--s-s:var(--${st.color}-soft)">
        <p class="step__no">STEP ${String(st.no).padStart(2, '0')}</p>
        <span class="step__ico">${ico(st.icon, 22)}</span>
        <h3 class="step__t">${st.name}</h3>
        <p class="step__d">${st.desc}</p>
        <p class="step__seq">${st.need
          ? `${ico('lock', 12, 2.2)} ${STAGES.find(x => x.id === st.need).name} 완료 후 진행`
          : `${ico('check', 12, 2.6)} 여기서 시작합니다`}</p>
      </article>`).join('')}</div>
  </section>`;
}

/* ---------- 튜토리얼 스트립 ---------- */
let tutOpen = true;
function renderTut(){
  if(!tutOpen) return '';
  const cur = currentStage();
  return `<div class="tut">
    <span class="tut__b">${ico('spark', 14, 2.4)} 이용 순서</span>
    <div class="tut__steps">${STAGES.map((st, i) => `
      ${i ? `<span class="tut__arrow">${ico('right', 12, 2.6)}</span>` : ''}
      <span class="tut__s" style="${st.id === cur.id ? 'box-shadow:0 0 0 2px var(--violet)' : ''}">
        <b>${st.no}</b>${st.name}</span>`).join('')}
    </div>
    <button class="tut__x" id="tutX" aria-label="안내 닫기">${ico('x', 15, 2.4)}</button>
  </div>`;
}

/* ---------- 전체 ---------- */
function render(){
  renderNav();
  $('#app').innerHTML = S().auth ? `
    ${renderTut()}
    ${renderHero()}
    <section class="grid">
      <div class="col-7">${renderTodos()}</div>
      <div class="col-5">${renderQuests()}</div>
    </section>
    <section class="grid">
      <div class="col-8">${renderCompetency()}</div>
      <div class="col-4">${renderAttendance()}</div>
    </section>
    <section>${renderPrograms()}</section>
    <section>${renderJobs()}</section>
  ` : renderGuest();
  syncRoll(); startRoll();
}

/* ============================================================================
   4. EVENTS — 상태 변화는 DATA를 고치고 다시 렌더한다.
   ============================================================================ */
document.addEventListener('click', e => {
  const scn = e.target.closest('[data-scn]');
  if(scn){ scenario = scn.dataset.scn; rollIdx = 0; render(); window.scrollTo({ top:0, behavior:'smooth' }); return; }

  const go = e.target.closest('[data-go]');
  if(go){ const st = STAGES.find(x => x.id === go.dataset.go); toast(`${st.no}단계 · ${st.name} 화면으로 이동합니다`); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){
    e.preventDefault();
    const st = STAGES.find(x => x.id === nav.dataset.nav);
    if(nav.dataset.lock === '1'){ toast(`${st.gateMsg}`); }
    else if(S().auth){ toast(`${st.no}단계 · ${st.name} 화면으로 이동합니다`); }
    return;
  }

  const todo = e.target.closest('[data-todo]');
  if(todo){
    const t = DATA.todos.find(x => x.id === todo.dataset.todo);
    t.done = !t.done; render();
    if(t.done) toast('할 일을 완료했습니다 +20P');
    return;
  }

  if(e.target.closest('#attBtn')){
    const d = DATA.attendance.week.find(x => x.s === 'today');
    if(d){ d.s = 'checked'; DATA.attendance.streak += 1; DATA.attendance.point += 50; render(); toast('출석체크 완료 +50P'); }
    return;
  }

  const ap = e.target.closest('[data-apply]');
  if(ap){
    const p = DATA.programs.find(x => x.id === ap.dataset.apply);
    if(p.isApplied) return;
    p.isApplied = true; p.applied += 1;
    const q = DATA.quests.find(x => x.id === 'q1'); if(q && q.now < q.goal) q.now += 1;
    render(); toast(`'${p.title}' 신청이 접수되었습니다`);
    return;
  }

  const r = e.target.closest('[data-roll]');
  if(r){ rollIdx += Number(r.dataset.roll); syncRoll(); startRoll(); return; }

  if(e.target.closest('#tutX')){ tutOpen = false; render(); }
});

document.addEventListener('mouseover', e => { if(e.target.closest('.roll')) clearInterval(rollTimer); });
document.addEventListener('mouseout',  e => { if(e.target.closest('.roll')) startRoll(); });
window.addEventListener('resize', syncRoll);

render();
</script>
</body>
</html>
