<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DREAMCATCH — 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ============================================================
   Design Foundations — 가이드라인 기반 값
   ============================================================ */
:root{
  --blue:#356dff;    --blue-soft:#eaf0ff;
  --violet:#7c5cfc;  --violet-soft:#f0edff;
  --mint:#20b486;    --mint-soft:#e5f8f2;
  --coral:#ff6b6b;   --coral-soft:#fff0f0;
  --amber:#f5a524;   --amber-soft:#fff6df;
  --sky:#17a9e6;     --sky-soft:#e7f7fd;
  --pink:#e85aad;    --pink-soft:#fdebf6;

  /* 중립 — 하늘빛 배경 위에 놓이므로 차갑게 보정 */
  --ink:#0e1729;
  --ink-2:#38455c;
  --ink-3:#6a7891;
  --ink-4:#96a3ba;
  --line:rgba(14,23,41,.08);
  --line-2:rgba(14,23,41,.05);

  /* 리퀴드 글래스 */
  --glass:linear-gradient(158deg,rgba(255,255,255,.80),rgba(255,255,255,.54));
  --glass-2:linear-gradient(158deg,rgba(255,255,255,.62),rgba(255,255,255,.38));
  --glass-brd:rgba(255,255,255,.78);
  --glass-lift:0 1px 0 rgba(255,255,255,.92) inset, 0 10px 30px rgba(16,54,110,.07);
  --glass-lift-2:0 1px 0 rgba(255,255,255,.95) inset, 0 18px 48px rgba(16,54,110,.12);

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* Typography scale — 표 정의값 그대로 */
.t-d2{font-size:40px;line-height:52px;letter-spacing:-.0282em}
.t-t1{font-size:32px;line-height:44px;letter-spacing:-.0253em}
.t-t3{font-size:24px;line-height:32px;letter-spacing:-.023em}
.t-h1{font-size:22px;line-height:30px;letter-spacing:-.0194em}
.t-h2{font-size:20px;line-height:28px;letter-spacing:-.012em}
.t-hl1{font-size:18px;line-height:26px;letter-spacing:-.002em}
.t-b1{font-size:16px;line-height:24px;letter-spacing:.0057em}
.t-b2{font-size:15px;line-height:22px;letter-spacing:.0096em}
.t-l1{font-size:14px;line-height:20px;letter-spacing:.0145em}
.t-l2{font-size:13px;line-height:18px;letter-spacing:.0194em}
.t-c1{font-size:12px;line-height:16px;letter-spacing:.0252em}
.t-c2{font-size:11px;line-height:14px;letter-spacing:.0311em}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;
  color:var(--ink);background:#eaf1fa;
  font-size:16px;line-height:24px;letter-spacing:.0057em;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
svg{display:block}

/* ---- 앰비언트 하늘빛 배경 : 글래스가 읽히려면 아래에 색이 있어야 한다 ---- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  linear-gradient(180deg,#f2f8ff 0%,#e8f1fb 42%,#eef4fc 100%)}
.sky i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55}
.sky .b1{width:620px;height:620px;left:-140px;top:-180px;background:radial-gradient(circle,var(--sky) 0%,transparent 68%)}
.sky .b2{width:540px;height:540px;right:-120px;top:-90px;background:radial-gradient(circle,var(--blue) 0%,transparent 68%);opacity:.34}
.sky .b3{width:680px;height:680px;left:34%;bottom:-320px;background:radial-gradient(circle,var(--violet) 0%,transparent 66%);opacity:.26}
.sky .b4{width:420px;height:420px;right:6%;bottom:-160px;background:radial-gradient(circle,var(--mint) 0%,transparent 68%);opacity:.24}

/* ---- 유리 표면 ---- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-brd);
  box-shadow:var(--glass-lift);
  border-radius:var(--r-lg);
}

/* ---- 반짝임 : 표면을 훑고 지나가는 반사광 ---- */
@keyframes sheen{
  0%{transform:translateX(-130%) skewX(-16deg)}
  56%,100%{transform:translateX(340%) skewX(-16deg)}
}
.shine{position:relative;overflow:hidden}
.shine::after{
  content:"";position:absolute;top:-40%;left:0;width:34%;height:180%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 7s var(--ease) infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.6)}
  50%{opacity:1;transform:scale(1)}
}
.spark{position:absolute;border-radius:50%;background:#fff;pointer-events:none;
  box-shadow:0 0 6px rgba(255,255,255,.9);animation:twinkle 2.6s ease-in-out infinite}

/* ============================================================
   Shell — 사이드바 + 본문
   ============================================================ */
.shell{display:flex;min-height:100vh}

.side{
  width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:24px;padding:24px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.34));
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border-right:1px solid rgba(255,255,255,.6);
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand__mark{
  width:32px;height:32px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--sky),var(--blue));
  box-shadow:0 4px 12px rgba(23,169,230,.34);
}
.brand__n{font-weight:800;letter-spacing:-.03em;font-size:17px;line-height:22px}
.brand__s{color:var(--ink-4);font-weight:600;font-size:11px;line-height:14px;letter-spacing:.0311em}

.side__lb{
  padding:0 10px;color:var(--ink-4);font-weight:700;margin-bottom:8px;
  font-size:11px;line-height:14px;letter-spacing:.0311em;
}
.snav{display:flex;flex-direction:column;gap:2px}
.snav__i{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-md);
  color:var(--ink-2);font-weight:600;font-size:14px;line-height:20px;letter-spacing:.0145em;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.snav__i:hover{background:rgba(255,255,255,.62)}
.snav__i[data-on="1"]{
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.7));
  color:var(--ink);box-shadow:0 2px 10px rgba(16,54,110,.08);
}
.snav__i[data-lock="1"]{color:var(--ink-4);cursor:not-allowed}
.snav__i[data-lock="1"]:hover{background:transparent}
.snav__n{
  width:22px;height:22px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  background:rgba(14,23,41,.06);color:var(--ink-3);
  font-size:11px;line-height:1;font-weight:800;font-feature-settings:"tnum";
}
.snav__i[data-on="1"] .snav__n{background:var(--c,var(--sky));color:#fff}
.snav__i[data-done="1"] .snav__n{background:var(--mint);color:#fff}
.snav__t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.typecard{
  margin-top:auto;padding:16px;border-radius:var(--r-md);position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--sky),var(--blue));color:#fff;
  box-shadow:0 8px 24px rgba(23,169,230,.28);
}
.typecard__l{opacity:.78;font-weight:700;font-size:11px;line-height:14px;letter-spacing:.0311em}
.typecard__c{font-weight:800;margin-top:6px;font-size:22px;line-height:30px;letter-spacing:-.0194em}
.typecard__d{opacity:.86;margin-top:2px;font-size:12px;line-height:16px;letter-spacing:.0252em}
.typecard--off{background:rgba(255,255,255,.55);color:var(--ink-3);box-shadow:none;border:1px dashed var(--line)}
.typecard--off .typecard__c{color:var(--ink-2);font-size:15px;line-height:22px;letter-spacing:.0096em}

.demo{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.5)}
.demo__l{color:var(--ink-4);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.0311em}
.seg{display:flex;gap:2px;padding:3px;background:rgba(14,23,41,.05);border-radius:var(--r-full)}
.seg button{
  flex:1;padding:6px 4px;border-radius:var(--r-full);color:var(--ink-3);font-weight:600;
  font-size:12px;line-height:16px;letter-spacing:.0252em;transition:all .18s var(--ease);
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,54,110,.1)}

/* ---- 본문 ---- */
.main{flex:1;min-width:0;padding:24px 28px 48px}
.main__in{max-width:1100px;margin:0 auto}
@media (min-width:1600px){ .main__in{max-width:1440px} }

.top{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.top__d{color:var(--ink-4);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.0252em}
.top__h{font-weight:800;margin-top:2px;font-size:28px;line-height:38px;letter-spacing:-.0236em}
.top__r{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{
  position:relative;width:40px;height:40px;border-radius:var(--r-full);display:grid;place-items:center;
  color:var(--ink-2);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.iconbtn:hover{background:rgba(255,255,255,.9)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:var(--r-full);
  background:var(--coral);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.who{
  display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:var(--r-full);
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.who__a{
  width:30px;height:30px;border-radius:var(--r-full);display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--sky),var(--violet));font-size:12px;font-weight:800;
}
.who__n{font-weight:700;font-size:13px;line-height:18px;letter-spacing:.0194em}
.who__m{color:var(--ink-4);font-size:11px;line-height:14px;letter-spacing:.0311em}
.btn-login{
  padding:11px 22px;border-radius:var(--r-full);color:#fff;font-weight:700;
  font-size:14px;line-height:20px;letter-spacing:.0145em;
  background:linear-gradient(140deg,var(--sky),var(--blue));
  box-shadow:0 6px 18px rgba(23,169,230,.32);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(23,169,230,.4)}

/* ---- 그리드 ---- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-bottom:20px}
@media (max-width:992px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:768px){ .grid{grid-template-columns:repeat(2,1fr)} }
.c3{grid-column:span 3}
.c4{grid-column:span 4}
.c5{grid-column:span 5}
.c7{grid-column:span 7}
.c8{grid-column:span 8}
@media (max-width:1200px){ .c3{grid-column:span 6} .c4,.c5,.c7,.c8{grid-column:1/-1} }
@media (max-width:768px){ .c3{grid-column:1/-1} }

/* ---- 카드 ---- */
.card{padding:22px;height:100%;position:relative;display:flex;flex-direction:column}
.card--flush{padding:0;overflow:hidden;height:100%}
.card--flush > .rl{display:flex;flex-direction:column;height:100%}
/* 자연 높이로 두는 행 — 늘려서 빈 공간을 만드는 것보다 낫다 */
.grid--top{align-items:start}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.hd__t{font-weight:700;margin:0;font-size:17px;line-height:26px;letter-spacing:-.002em}
.hd__d{color:var(--ink-3);margin-top:2px;font-size:12px;line-height:16px;letter-spacing:.0252em}
.hd__r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);
  font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:800;
  background:rgba(14,23,41,.05);color:var(--ink-3);
}
.pill--blue{background:var(--blue-soft);color:var(--blue)}
.pill--violet{background:var(--violet-soft);color:var(--violet)}
.pill--mint{background:var(--mint-soft);color:var(--mint)}
.pill--amber{background:var(--amber-soft);color:#b97708}
.pill--coral{background:var(--coral-soft);color:var(--coral)}
.pill--sky{background:var(--sky-soft);color:var(--sky)}
.pill--pink{background:var(--pink-soft);color:var(--pink)}
.tlink{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font-weight:600;
  font-size:12px;line-height:16px;letter-spacing:.0252em;padding:4px 8px;border-radius:var(--r-sm)}
.tlink:hover{background:rgba(255,255,255,.7);color:var(--ink)}

/* ---- 순차 게이팅 잠금 ---- */
.gate{position:relative;overflow:hidden}
.gate__v{
  position:absolute;inset:0;z-index:2;border-radius:var(--r-lg);
  background:linear-gradient(160deg,rgba(255,255,255,.76),rgba(255,255,255,.6));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:20px;text-align:center;
}
.gate__l{
  width:40px;height:40px;border-radius:var(--r-full);display:grid;place-items:center;margin-bottom:2px;
  background:rgba(255,255,255,.9);color:var(--ink-3);box-shadow:0 4px 14px rgba(16,54,110,.12);
}
.gate__t{font-weight:700;font-size:14px;line-height:20px;letter-spacing:.0145em}
.gate__d{color:var(--ink-3);max-width:270px;font-size:12px;line-height:16px;letter-spacing:.0252em}
.gate__b{
  margin-top:8px;padding:8px 16px;border-radius:var(--r-full);color:#fff;font-weight:700;
  font-size:12px;line-height:16px;letter-spacing:.0252em;
  background:linear-gradient(140deg,var(--sky),var(--blue));box-shadow:0 4px 14px rgba(23,169,230,.3);
}
.gate__b:hover{filter:brightness(1.06)}
.gate.is-locked > *:not(.gate__v){filter:grayscale(.85);opacity:.42;pointer-events:none;user-select:none}

/* ============================================================
   스탯 타일
   ============================================================ */
.stat{padding:20px;display:flex;flex-direction:column;gap:12px;height:100%}
.stat__top{display:flex;align-items:center;gap:10px}
.stat__i{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:var(--s-s);color:var(--s-c);
}
.stat__l{color:var(--ink-3);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.0252em}
.stat__v{
  font-weight:800;font-feature-settings:"tnum";
  font-size:32px;line-height:44px;letter-spacing:-.0253em;
}
.stat__v small{font-size:15px;font-weight:700;color:var(--ink-4);margin-left:2px;letter-spacing:0}
.stat__f{display:flex;align-items:center;gap:6px;margin-top:auto}
.stat__bar{flex:1;height:5px;border-radius:3px;background:rgba(14,23,41,.07);overflow:hidden}
.stat__bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--s-c),var(--sky));transition:width .8s var(--ease)}
.stat__sub{color:var(--ink-4);font-weight:600;font-size:11px;line-height:14px;letter-spacing:.0311em;white-space:nowrap}
.stat[data-off="1"] .stat__v{color:var(--ink-4)}

/* ============================================================
   로드맵 레일
   ============================================================ */
.rm{padding:22px;position:relative;height:100%}
.rm__top{display:flex;align-items:flex-start;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.rm__h{font-weight:800;margin:0;font-size:22px;line-height:30px;letter-spacing:-.0194em}
.rm__h em{font-style:normal;background:linear-gradient(100deg,var(--sky),var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rm__d{color:var(--ink-3);margin-top:4px;font-size:13px;line-height:18px;letter-spacing:.0194em}
.rm__pct{margin-left:auto;text-align:right;flex-shrink:0}
.rm__pn{font-weight:800;font-feature-settings:"tnum";font-size:32px;line-height:44px;letter-spacing:-.0253em}
.rm__pn small{font-size:16px;color:var(--ink-4);margin-left:1px}
.rm__pl{color:var(--ink-4);font-weight:600;font-size:11px;line-height:14px;letter-spacing:.0311em}

.rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:768px){ .rail{grid-template-columns:1fr;gap:14px} }
.rail__t{position:absolute;left:22px;right:22px;top:23px;height:3px;border-radius:2px;background:rgba(14,23,41,.07)}
.rail__f{position:absolute;left:22px;top:23px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--sky),var(--blue),var(--mint));transition:width .8s var(--ease)}
@media (max-width:768px){ .rail__t,.rail__f{display:none} }

.st{position:relative;z-index:1;text-align:center}
.st__d{
  width:46px;height:46px;border-radius:var(--r-full);margin:0 auto 12px;position:relative;
  display:grid;place-items:center;color:var(--ink-4);
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 4px 14px rgba(16,54,110,.08);transition:all .3s var(--ease);
}
.st__n{
  position:absolute;top:-3px;right:-3px;width:18px;height:18px;border-radius:var(--r-full);
  display:grid;place-items:center;background:rgba(14,23,41,.12);color:#fff;
  font-size:10px;line-height:1;font-weight:800;font-feature-settings:"tnum";
  border:2px solid rgba(255,255,255,.95);
}
.st__t{font-weight:700;font-size:14px;line-height:20px;letter-spacing:.0145em}
.st__s{color:var(--ink-4);font-weight:600;margin-top:3px;font-size:11px;line-height:14px;letter-spacing:.0311em}
.st__b{height:4px;border-radius:2px;background:rgba(14,23,41,.07);margin:8px auto 0;max-width:80px;overflow:hidden}
.st__b i{display:block;height:100%;border-radius:2px}

.st[data-s="done"] .st__d{color:var(--mint);background:linear-gradient(150deg,#fff,var(--mint-soft));border-color:rgba(32,180,134,.28)}
.st[data-s="done"] .st__n{background:var(--mint)}
.st[data-s="done"] .st__s{color:var(--mint)}
.st[data-s="current"] .st__d{
  color:#fff;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 62%,#fff));
  border-color:rgba(255,255,255,.95);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 14%,transparent),0 8px 22px color-mix(in srgb,var(--c) 34%,transparent);
}
.st[data-s="current"] .st__n{background:var(--c)}
.st[data-s="current"] .st__s{color:var(--c)}
.st[data-s="locked"] .st__d{border-style:dashed;border-color:rgba(14,23,41,.14);background:rgba(255,255,255,.55);box-shadow:none}
.st[data-s="locked"] .st__t{color:var(--ink-4)}

.act{
  margin-top:24px;padding:16px 18px;border-radius:var(--r-md);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 12%,rgba(255,255,255,.7)),rgba(255,255,255,.55));
  border:1px solid color-mix(in srgb,var(--c) 20%,transparent);
}
.act__i{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));
  box-shadow:0 4px 14px color-mix(in srgb,var(--c) 34%,transparent)}
.act__t{font-weight:700;font-size:15px;line-height:22px;letter-spacing:.0096em}
.act__d{color:var(--ink-2);margin-top:2px;font-size:13px;line-height:18px;letter-spacing:.0194em}
.act__b{
  margin-left:auto;padding:11px 20px;border-radius:var(--r-full);color:#fff;font-weight:700;flex-shrink:0;

/* ============================================================================
   2. GATE — 순차 게이팅 판정은 여기서만
   ============================================================================ */
let scenario = 'active';
const S = () => SCENARIOS[scenario];

function stageState(id){
  const s = S();
  if(!s.auth) return 'locked';
  const st = STAGES.find(x => x.id === id);
  const p  = s.progress[id] ?? 0;
  if(st.need && (s.progress[st.need] ?? 0) < 100) return 'locked';
  return p >= 100 ? 'done' : 'current';
}
/* needId 단계가 "완료"돼야 열린다. 잠겼다면 지금 해야 할 단계를 blocker로 돌려준다 */
function gateOf(needId){
  const s = S();
  if(!s.auth) return { open:false, blocker:null, msg:'로그인 후 이용할 수 있습니다.', cta:'로그인' };
  const chain = [];
  let cur = STAGES.find(x => x.id === needId);
  while(cur){ chain.unshift(cur); cur = cur.need ? STAGES.find(x => x.id === cur.need) : null; }
  for(const c of chain){
    if((s.progress[c.id] ?? 0) < 100)
      return { open:false, blocker:c, msg:c.gateMsg, cta:`${c.name} 하러 가기` };
  }
  return { open:true };
}
const overallPct = () => S().auth
  ? Math.round(STAGES.reduce((a, st) => a + (S().progress[st.id] ?? 0), 0) / STAGES.length) : 0;
const currentStage = () => STAGES.find(st => stageState(st.id) === 'current') || STAGES[STAGES.length - 1];

function renderRadar(){
  const c = DATA.competency, n = c.axes.length, cx = 140, cy = 134, R = 90;
  const pt = (i, v) => {
    const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n, r = (v / 100) * R;
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const poly = k => c.axes.map((a, i) => pt(i, a[k]).map(v => v.toFixed(1)).join(',')).join(' ');
  const rings = [25, 50, 75, 100].map(p =>
    `<polygon points="${c.axes.map((_, i) => pt(i, p).map(v => v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="rgba(14,23,41,.08)" stroke-width="1"/>`).join('');
  const spokes = c.axes.map((_, i) => {
    const [x, y] = pt(i, 100);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(14,23,41,.08)"/>`;
  }).join('');
  const labels = c.axes.map((a, i) => {
    const [x, y] = pt(i, 118);
    const anc = Math.abs(x - cx) < 12 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="${anc}" font-size="11"
      letter-spacing=".03em" font-weight="700" fill="var(--ink-3)">${a.key}</text>
      <text x="${x.toFixed(1)}" y="${(y + 16).toFixed(1)}" text-anchor="${anc}" font-size="10"
      font-weight="800" fill="var(--sky)">${a.me}</text>`;
  }).join('');
  const dots = c.axes.map((a, i) => {
    const [x, y] = pt(i, a.me);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--sky)" stroke="#fff" stroke-width="2"/>`;
  }).join('');

  const body = `
    <header class="hd">
      <div><h2 class="hd__t">역량 그래프</h2><p class="hd__d">6개 영역 · 유형 평균 대비</p></div>
      <div class="hd__r"><span class="pill pill--mint">▲ ${c.gained}</span></div>
    </header>
    <div class="rad">
      <svg viewBox="0 0 280 272" width="100%" style="max-width:280px" role="img" aria-label="역량 레이더 차트">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--sky)" stop-opacity=".34"/>
          <stop offset="100%" stop-color="var(--blue)" stop-opacity=".14"/>
        </linearGradient></defs>
        ${rings}${spokes}
        <polygon points="${poly('avg')}" fill="none" stroke="var(--ink-4)" stroke-width="1.4" stroke-dasharray="4 4"/>
        <polygon points="${poly('me')}" fill="url(#rg)" stroke="var(--sky)" stroke-width="2.4" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>
      <div class="rad__lg">
        <span class="rad__k"><i class="rad__kd" style="background:var(--sky)"></i>내 점수</span>
        <span class="rad__k"><i class="rad__kd" style="background:var(--ink-4)"></i>유형 평균</span>
      </div>
      <div class="rad__st">
        <div class="rad__c"><b>${c.total}점</b><span>종합 역량점수</span></div>
        <div class="rad__c"><b>${c.rank}</b><span>동일 유형 내</span></div>
      </div>
    </div>`;
  return gated('diagnosis', body, '역량 점수는 진단 결과에서 산출됩니다.');
}

  const body = `<div class="rl">

      <div><h2 class="hd__t">비교과 프로그램</h2>
        <p class="hd__d">${s.type ? `${s.type.code} ${s.type.name} 유형에 맞춰 로드맵이 추천` : '진단 유형이 정해지면 맞춤 추천됩니다'}</p></div>
      <div class="hd__r">
        <a class="tlink" href="#">전체 ${ico('arrow', 12, 2.2)}</a>
        <div class="rl__nav">
          <button class="rl__ar" data-roll="-1" aria-label="이전">${ico('left', 14, 2.4)}</button>
          <button class="rl__ar" data-roll="1" aria-label="다음">${ico('right', 14, 2.4)}</button>
        </div>
      </div>
    </header>
    <div class="rl__vp"><div class="rl__tr" id="rollTrack">
      ${list.map(p => `<article class="rl__c" style="--p-c:var(--${p.color})">
        <div class="rl__th"><span class="rl__bg">${p.cat}</span><span class="rl__cap">${p.applied}/${p.cap}명</span></div>
        <div class="rl__bd">
          <h3 class="rl__t">${p.title}</h3>
          <p class="rl__m">${p.org} · ${p.period}</p>
          <div class="rl__f">
            ${p.match && s.type ? `<span class="pill pill--${p.color}">${s.type.code} 맞춤</span>` : `<span class="pill">자유참여</span>`}
            <button class="rl__ap" data-apply="${p.id}" data-a="${p.isApplied ? 1 : 0}">${p.isApplied ? '신청완료' : '신청하기'}</button>
          </div>
        </div>
      </article>`).join('')}
    </div></div>
    <div class="rl__dt" id="rollDots"></div>
  </div>`;
  return gated('roadmap', body, '로드맵이 생성되어야 유형에 맞는 프로그램을 신청할 수 있습니다.', 'card--flush');
}

function syncRoll(){
  const tr = $('#rollTrack'); if(!tr) return;
  const pages = rollPages();
  rollIdx = ((rollIdx % pages) + pages) % pages;
  const c = tr.querySelector('.rl__c'); if(!c) return;
  tr.style.transform = `translateX(${-rollIdx * (c.getBoundingClientRect().width + 16)}px)`;
  const d = $('#rollDots');
  if(d) d.innerHTML = Array.from({ length: pages },
    (_, i) => `<span class="rl__d" data-on="${i === rollIdx ? 1 : 0}"></span>`).join('');
}
function startRoll(){
  clearInterval(rollTimer);
  if(!gateOf('roadmap').open) return;
  rollTimer = setInterval(() => { rollIdx++; syncRoll(); }, 4500);
}

/* ---------- 채용공고 ---------- */
function renderJobs(){
  const body = `
    <header class="hd">
      <div><h2 class="hd__t">추천 채용공고</h2><p class="hd__d">역량 그래프 기반 매칭</p></div>
      <div class="hd__r"><a class="tlink" href="#">전체 ${ico('arrow', 12, 2.2)}</a></div>
    </header>
    <ul class="jb">${DATA.jobs.map(j => `
      <li class="jb__i" style="--j-c:var(--${j.color});--j-s:var(--${j.color}-soft)">
        <span class="jb__lg">${j.mark}</span>
        <div class="jb__b"><p class="jb__t">${j.title}</p><p class="jb__m">${j.co} · ${j.loc}</p></div>
        <div class="jb__r"><p class="jb__mt">${j.match}%</p><p class="jb__dd">${j.dday}</p></div>
      </li>`).join('')}</ul>`;
  return gated('growth', body,
    `역량강화 활동을 모두 이수하면 매칭 결과가 공개됩니다. (현재 ${S().progress.growth ?? 0}%)`);
}

/* ---------- 비로그인 ---------- */
function renderGuest(){
  return `
  <section class="glass gst shine">
    <span class="spark" style="width:5px;height:5px;top:18%;right:12%;animation-delay:.3s"></span>
    <span class="spark" style="width:3px;height:3px;top:42%;right:20%;animation-delay:1.4s"></span>
    <span class="spark" style="width:4px;height:4px;top:66%;right:9%;animation-delay:2.2s"></span>
    <div class="gst__in">
      <span class="gst__e">${ico('spark', 12, 2.6)} 국립창원대학교 역량개발관리시스템</span>
      <h1 class="gst__h">진단부터 취업까지,<br/><em>순서대로 따라오세요</em></h1>
      <p class="gst__p">진단으로 내 유형을 찾고, 상담으로 방향을 정하고,
        그 결과로 만들어진 로드맵을 따라 역량을 쌓아 취업까지 이어집니다.</p>
      <div class="gst__c">
        <button class="btn-login" data-scn="pre">학생 로그인</button>
        <button class="gst__b2" data-scn="active">진행중 화면 미리보기</button>
      </div>
    </div>
  </section>
  <section>
    <header class="hd" style="margin-bottom:14px">
      <div><h2 class="hd__t">5단계 진행 과정</h2><p class="hd__d">앞 단계를 마쳐야 다음 단계가 열립니다</p></div>
    </header>
    <div class="stps">${STAGES.map(st => `
      <article class="glass stp" style="--c:var(--${st.color})">
        <p class="stp__n">STEP ${String(st.no).padStart(2, '0')}</p>
        <span class="stp__i">${ico(st.icon, 19)}</span>
        <h3 class="stp__t">${st.name}</h3>
        <p class="stp__d">${st.desc}</p>
        <p class="stp__s">${st.need
          ? `${ico('lock', 11, 2.2)} ${STAGES.find(x => x.id === st.need).name} 완료 후`
          : `${ico('check', 11, 2.6)} 여기서 시작`}</p>
      </article>`).join('')}</div>
  </section>`;
}

/* ---------- 전체 ---------- */
function render(){
  renderSide(); renderTop();
  $('#app').innerHTML = S().auth ? `
    <div class="grid">${renderStats()}</div>
    <div class="grid">
      <div class="c8">${renderRoadmap()}</div>
      <div class="c4">${renderAtt()}</div>
    </div>
    <div class="grid">
      <div class="c4">${renderRadar()}</div>
      <div class="c4">${renderTodos()}</div>
      <div class="c4">${renderQuests()}</div>
    </div>
    <div class="grid grid--top">
      <div class="c7">${renderPrograms()}</div>
      <div class="c5">${renderJobs()}</div>
    </div>
  ` : renderGuest();
  syncRoll(); startRoll();
}

/* ============================================================================
   4. EVENTS — 상태 변화는 DATA를 고치고 다시 렌더한다
   ============================================================================ */
document.addEventListener('click', e => {
  const scn = e.target.closest('[data-scn]');
  if(scn){ scenario = scn.dataset.scn; rollIdx = 0; render(); return; }

  const go = e.target.closest('[data-go]');
  if(go){ const st = STAGES.find(x => x.id === go.dataset.go); toast(`${st.no}단계 · ${st.name} 화면으로 이동합니다`); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){
    e.preventDefault();
    const st = STAGES.find(x => x.id === nav.dataset.nav);
    toast(nav.dataset.lock === '1' ? st.gateMsg : `${st.no}단계 · ${st.name} 화면으로 이동합니다`);
    return;
  }

  const td = e.target.closest('[data-todo]');
  if(td){
    const t = DATA.todos.find(x => x.id === td.dataset.todo);
    t.done = !t.done; render();
    if(t.done) toast('할 일을 완료했습니다 +20P');
    return;
  }

  if(e.target.closest('#attBtn')){
    const d = DATA.attendance.week.find(x => x.s === 'today');
    if(d){ d.s = 'checked'; DATA.attendance.streak += 1; DATA.attendance.point += 50; render(); toast('출석체크 완료 +50P'); }
    return;
  }

  const ap = e.target.closest('[data-apply]');
  if(ap){
    const p = DATA.programs.find(x => x.id === ap.dataset.apply);
    if(p.isApplied) return;
    p.isApplied = true; p.applied += 1;
    const q = DATA.quests.find(x => x.id === 'q1'); if(q && q.now < q.goal) q.now += 1;
    render(); toast(`'${p.title}' 신청이 접수되었습니다`);
    return;
  }

  const r = e.target.closest('[data-roll]');
  if(r){ rollIdx += Number(r.dataset.roll); syncRoll(); startRoll(); }
});

document.addEventListener('mouseover', e => { if(e.target.closest('.rl')) clearInterval(rollTimer); });
document.addEventListener('mouseout',  e => { if(e.target.closest('.rl')) startRoll(); });
window.addEventListener('resize', syncRoll);

render();
</script>
</body>
</html>
